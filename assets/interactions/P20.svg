<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="100%" height="100%" role="img"><title>P20: Reflection-augmented loop collaboration and interaction</title><defs><marker id="paperArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 z" fill="#111111"/></marker></defs><rect width="1800" height="1200" fill="#FFFFFF"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="50.0" y="53.0">P20  Reflection-augmented loop</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" font-style="italic" fill="#333333" text-anchor="start"><tspan x="51.0" y="82.0">Primitive · A² A2/A3 · cycle role collaboration</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#444444" text-anchor="start"><tspan x="51.0" y="107.0">Use feedback to revise attempts.</tspan></text><line x1="50" y1="122" x2="1750" y2="122" stroke="#111111" stroke-width="1.1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="50.0" y="151.0">STRUCTURE · PARTICIPANT COLLABORATION</tspan></text><rect x="615.0" y="141.0" width="210.0" height="118.0" fill="#EDF3F8" stroke="#111111" stroke-width="1.4"/><line x1="615.0" y1="194.0" x2="825.0" y2="194.0" stroke="#111111" stroke-width="1"/><g transform="translate(637.0 166.0)"><circle cx="0" cy="-8" r="3.4" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-5.3,5.3 Q0,-0.3 5.3,5.3" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#444444" text-anchor="start"><tspan x="658.0" y="159.0">SOURCE</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="658.0" y="176.0">Agent</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="625.0" y="214.0">+ send propose(attempt)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="625.0" y="229.0">+ recv revise(retry)</tspan></text><rect x="1014.4" y="299.9" width="210.0" height="118.0" fill="#EAF3EA" stroke="#111111" stroke-width="1.4"/><line x1="1014.4" y1="352.9" x2="1224.4" y2="352.9" stroke="#111111" stroke-width="1"/><g transform="translate(1036.4437368439644 324.9260912937621)"><path d="M-4.8,-0.8 A4.8,4.8 0 1 1 3.4,-3.9" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.2,-5.9 L4.2,-2.8 L1.1,-3.1" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#444444" text-anchor="start"><tspan x="1057.4" y="317.9">RUNTIME</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1057.4" y="334.9">Attempt</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="1024.4" y="372.9">+ send request(critique)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="1024.4" y="387.9">+ recv propose(attempt)</tspan></text><rect x="861.9" y="557.1" width="210.0" height="118.0" fill="#F6E0E4" stroke="#111111" stroke-width="1.4"/><line x1="861.9" y1="610.1" x2="1071.9" y2="610.1" stroke="#111111" stroke-width="1"/><g transform="translate(883.8698059628387 582.073908706238)"><path d="M-4.8,-0.8 A4.8,4.8 0 1 1 3.4,-3.9" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.2,-5.9 L4.2,-2.8 L1.1,-3.1" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#444444" text-anchor="start"><tspan x="904.9" y="575.1">CORE</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="904.9" y="592.1">CritiqueLoop</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="871.9" y="630.1">+ send evaluate(attempt)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="871.9" y="645.1">+ recv request(critique)</tspan></text><rect x="368.1" y="557.1" width="210.0" height="118.0" fill="#FFF3C9" stroke="#111111" stroke-width="1.4"/><line x1="368.1" y1="610.1" x2="578.1" y2="610.1" stroke="#111111" stroke-width="1"/><g><path d="M384.8,582.1 Q390.1,577.3 395.5,582.1 Q390.1,586.8 384.8,582.1" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390.1" cy="582.1" r="1.4" fill="#111111"/></g><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#444444" text-anchor="start"><tspan x="411.1" y="575.1">EXTERNAL</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="411.1" y="592.1">Evaluator</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="378.1" y="630.1">+ send feedback(result)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="378.1" y="645.1">+ recv evaluate(attempt)</tspan></text><rect x="215.6" y="299.9" width="210.0" height="118.0" fill="#FBEBDD" stroke="#111111" stroke-width="1.4"/><line x1="215.6" y1="352.9" x2="425.6" y2="352.9" stroke="#111111" stroke-width="1"/><path d="M237.6,319.6 L242.0,322.1 L241.1,327.7 L237.6,330.5 L234.1,327.7 L233.1,322.1 Z" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#444444" text-anchor="start"><tspan x="258.6" y="317.9">POLICY</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="258.6" y="334.9">RetryPolicy</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="225.6" y="372.9">+ send revise(retry)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="225.6" y="387.9">+ recv feedback(result)</tspan></text><path d="M827.0,200.0 L919.7,200.0 L919.7,358.9 L1012.4,358.9" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="919.7" cy="279.5" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="919.7" y="283.5">1</tspan></text><path d="M1119.4,419.9 L1119.4,487.5 L966.9,487.5 L966.9,555.1" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="1043.2" cy="487.5" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="1043.2" y="491.5">2</tspan></text><path d="M859.9,616.1 L720.0,616.1 L580.1,616.1" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="720.0" cy="616.1" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="720.0" y="620.1">3</tspan></text><path d="M473.1,555.1 L473.1,487.5 L320.6,487.5 L320.6,419.9" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="396.8" cy="487.5" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="396.8" y="491.5">4</tspan></text><path d="M427.6,358.9 L520.3,358.9 L520.3,200.0 L613.0,200.0" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="520.3" cy="279.5" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="520.3" y="283.5">5</tspan></text><rect x="1300" y="155" width="450" height="370" fill="#FFFFFF" stroke="#222222" stroke-width="1" stroke-dasharray="7 5"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="1318.0" y="184.0">PATTERN INTERFACE</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" font-style="italic" fill="#B26A00" text-anchor="start"><tspan x="1318.0" y="214.0">context</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1318.0" y="234.0">An attempt can be evaluated before a further</tspan><tspan x="1318.0" y="252.0">attempt.</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" font-style="italic" fill="#B26A00" text-anchor="start"><tspan x="1318.0" y="281.0">trigger</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1318.0" y="301.0">The attempt fails or receives a critique.</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" font-style="italic" fill="#B26A00" text-anchor="start"><tspan x="1318.0" y="348.0">structure</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1318.0" y="368.0">Attempt record, feedback producer, revision input,</tspan><tspan x="1318.0" y="386.0">and retry bound.</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" font-style="italic" fill="#B26A00" text-anchor="start"><tspan x="1318.0" y="415.0">effect</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1318.0" y="435.0">A revised attempt uses recorded feedback while</tspan><tspan x="1318.0" y="453.0">preserving attempt lineage.</tspan></text><rect x="1300" y="545" width="450" height="350" fill="#FFFFFF" stroke="#777777" stroke-width="0.9" stroke-dasharray="6 5"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="1318.0" y="573.0">CONTRACT ANNOTATIONS</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" font-style="italic" fill="#B26A00" text-anchor="start"><tspan x="1318.0" y="602.0">requires</tspan><tspan x="1318.0" y="674.0">ensures</tspan><tspan x="1318.0" y="746.0">invariant</tspan><tspan x="1318.0" y="818.0">violation</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1410.0" y="602.0">Failure evidence and remaining retry budget</tspan><tspan x="1410.0" y="619.0">are available.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1410.0" y="674.0">Feedback is attached to the attempt that</tspan><tspan x="1410.0" y="691.0">produced it and is visible to revision.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1410.0" y="746.0">Self-critique is not represented as</tspan><tspan x="1410.0" y="763.0">independent verification.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1410.0" y="818.0">Empty, contradictory, or exhausted feedback</tspan><tspan x="1410.0" y="835.0">terminates or escalates.</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="50.0" y="744.0">INTERACTION</tspan></text><rect x="15.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="120.0" y="777.0">Agent</tspan></text><line x1="120.0" y1="792" x2="120.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><rect x="285.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="390.0" y="777.0">Attempt</tspan></text><line x1="390.0" y1="792" x2="390.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><rect x="555.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="660.0" y="777.0">CritiqueLoop</tspan></text><line x1="660.0" y1="792" x2="660.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><rect x="825.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="930.0" y="777.0">Evaluator</tspan></text><line x1="930.0" y1="792" x2="930.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><rect x="1095.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="1200.0" y="777.0">RetryPolicy</tspan></text><line x1="1200.0" y1="792" x2="1200.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><line x1="120.0" y1="845" x2="390.0" y2="845" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="255.0" y="838.0">1  propose(attempt)</tspan></text><line x1="390.0" y1="883" x2="660.0" y2="883" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="525.0" y="876.0">2  request(critique)</tspan></text><line x1="660.0" y1="921" x2="930.0" y2="921" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="795.0" y="914.0">3  evaluate(attempt)</tspan></text><line x1="930.0" y1="959" x2="1200.0" y2="959" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="1065.0" y="952.0">4  feedback(result)</tspan></text><line x1="1200.0" y1="997" x2="120.0" y2="997" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)" stroke-dasharray="7 5"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="660.0" y="990.0">5  revise(retry)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="50.0" y="1060.0">MESSAGE TRACE</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" font-style="normal" fill="#111111" text-anchor="start"><tspan x="280.0" y="1060.0">1 propose(attempt) → 2 request(critique) → 3 evaluate(attempt) → 4 feedback(result) → 5 revise(retry)</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#555555" text-anchor="start"><tspan x="50.0" y="1110.0">Evidence: 32/41 repositories, 29/36 families; 32 trajectories (16 multi-checkpoint); exact audit: not sampled.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#555555" text-anchor="start"><tspan x="50.0" y="1136.0">Variation: Self-critique, external evaluator, memory injection, and iterative refinement.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#555555" text-anchor="start"><tspan x="50.0" y="1164.0">Negative control: A static system prompt asking the model to reflect is not enough.</tspan></text></svg>