<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="100%" height="100%" role="img"><title>R02: Verbal reflection memory collaboration and interaction</title><defs><marker id="paperArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 z" fill="#111111"/></marker></defs><rect width="1800" height="1200" fill="#FFFFFF"/><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="50.0" y="53.0">R02  Verbal reflection memory</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" font-style="italic" fill="#333333" text-anchor="start"><tspan x="51.0" y="82.0">Reasoning · A² A2/A3 · memory role collaboration</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#444444" text-anchor="start"><tspan x="51.0" y="107.0">Reuse feedback across attempts.</tspan></text><line x1="50" y1="122" x2="1750" y2="122" stroke="#111111" stroke-width="1.1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="50.0" y="151.0">STRUCTURE · PARTICIPANT COLLABORATION</tspan></text><rect x="10.0" y="271.0" width="210.0" height="118.0" fill="#EDF3F8" stroke="#111111" stroke-width="1.4"/><line x1="10.0" y1="324.0" x2="220.0" y2="324.0" stroke="#111111" stroke-width="1"/><g transform="translate(32.0 296.0)"><path d="M-4.8,-0.8 A4.8,4.8 0 1 1 3.4,-3.9" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.2,-5.9 L4.2,-2.8 L1.1,-3.1" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-sty