inejoin="round"/></g><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#444444" text-anchor="start"><tspan x="825.5" y="504.0">POLICY</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="825.5" y="521.0">RetrievalPolicy</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="792.5" y="559.0">+ send retrieve(context)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="792.5" y="574.0">+ recv index(feedback)</tspan></text><rect x="1040.0" y="486.0" width="210.0" height="118.0" fill="#FFF3C9" stroke="#111111" stroke-width="1.4"/><line x1="1040.0" y1="539.0" x2="1250.0" y2="539.0" stroke="#111111" stroke-width="1"/><g transform="translate(1062.0 511.0)"><circle cx="0" cy="-8" r="3.4" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-5.3,5.3 Q0,-0.3 5.3,5.3" stroke="#111111" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#444444" text-anchor="start"><tspan x="1083.0" y="504.0">EXTERNAL</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1083.0" y="521.0">NextAttempt</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="1050.0" y="559.0">+ send retry(failure)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" font-style="normal" fill="#222222" text-anchor="start"><tspan x="1050.0" y="574.0">+ recv retrieve(context)</tspan></text><path d="M222.0,330.0 L243.8,330.0 L265.5,330.0" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="243.8" cy="330.0" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="243.8" y="334.0">1</tspan></text><path d="M479.5,330.0 L501.2,330.0 L523.0,330.0" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="501.2" cy="330.0" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="501.2" y="334.0">2</tspan></text><path d="M737.0,330.0 L758.8,330.0 L758.8,545.0 L780.5,545.0" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="758.8" cy="437.5" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="758.8" y="441.5">3</tspan></text><path d="M994.5,545.0 L1016.2,545.0 L1038.0,545.0" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="1016.2" cy="545.0" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="1016.2" y="549.0">4</tspan></text><path d="M1145.0,484.0 L1145.0,437.5 L115.0,437.5 L115.0,391.0" fill="none" stroke="#111111" stroke-width="1.35" marker-end="url(#paperArrow)"/><circle cx="630.0" cy="437.5" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="630.0" y="441.5">5</tspan></text><rect x="1300" y="155" width="450" height="370" fill="#FFFFFF" stroke="#222222" stroke-width="1" stroke-dasharray="7 5"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="1318.0" y="184.0">PATTERN INTERFACE</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" font-style="italic" fill="#B23A00" text-anchor="start"><tspan x="1318.0" y="214.0">context</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1318.0" y="234.0">An agent receives feedback that can inform later</tspan><tspan x="1318.0" y="252.0">attempts.</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" font-style="italic" fill="#B23A00" text-anchor="start"><tspan x="1318.0" y="281.0">trigger</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1318.0" y="301.0">A failure or critique is verbalized and stored.</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" font-style="italic" fill="#B23A00" text-anchor="start"><tspan x="1318.0" y="348.0">structure</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1318.0" y="368.0">Reflection producer, retrieval key, memory scope,</tspan><tspan x="1318.0" y="386.0">and update policy.</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" font-style="italic" fill="#B23A00" text-anchor="start"><tspan x="1318.0" y="415.0">effect</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1318.0" y="435.0">A later attempt retrieves attributable feedback</tspan><tspan x="1318.0" y="453.0">and uses it in context.</tspan></text><rect x="1300" y="545" width="450" height="350" fill="#FFFFFF" stroke="#777777" stroke-width="0.9" stroke-dasharray="6 5"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="1318.0" y="573.0">CONTRACT ANNOTATIONS</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" font-style="italic" fill="#B23A00" text-anchor="start"><tspan x="1318.0" y="602.0">requires</tspan><tspan x="1318.0" y="674.0">ensures</tspan><tspan x="1318.0" y="746.0">invariant</tspan><tspan x="1318.0" y="818.0">violation</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1410.0" y="602.0">Attempt and feedback identities are linked.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1410.0" y="674.0">Retrieved reflection retains source and</tspan><tspan x="1410.0" y="691.0">remains updateable or revocable.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1410.0" y="746.0">Reflected explanations are not promoted to</tspan><tspan x="1410.0" y="763.0">verified facts.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#111827" text-anchor="start"><tspan x="1410.0" y="818.0">Contradictory or poisoned reflections are</tspan><tspan x="1410.0" y="835.0">filtered or explicit.</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="50.0" y="744.0">INTERACTION</tspan></text><rect x="15.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="120.0" y="777.0">Attempt</tspan></text><line x1="120.0" y1="792" x2="120.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><rect x="285.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="390.0" y="777.0">ReflectionProducer</tspan></text><line x1="390.0" y1="792" x2="390.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><rect x="555.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="660.0" y="777.0">ReflectionMemory</tspan></text><line x1="660.0" y1="792" x2="660.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><rect x="825.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="930.0" y="777.0">RetrievalPolicy</tspan></text><line x1="930.0" y1="792" x2="930.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><rect x="1095.0" y="752" width="210.0" height="40" fill="#EDF3F8" stroke="#111111" stroke-width="1"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" font-style="normal" fill="#111827" text-anchor="middle"><tspan x="1200.0" y="777.0">NextAttempt</tspan></text><line x1="1200.0" y1="792" x2="1200.0" y2="1018" stroke="#666666" stroke-width="0.9" stroke-dasharray="6 6"/><line x1="120.0" y1="845" x2="390.0" y2="845" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="255.0" y="838.0">1  execute(attempt)</tspan></text><line x1="390.0" y1="883" x2="660.0" y2="883" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="525.0" y="876.0">2  write(reflection)</tspan></text><line x1="660.0" y1="921" x2="930.0" y2="921" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="795.0" y="914.0">3  index(feedback)</tspan></text><line x1="930.0" y1="959" x2="1200.0" y2="959" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="1065.0" y="952.0">4  retrieve(context)</tspan></text><line x1="1200.0" y1="997" x2="120.0" y2="997" stroke="#111111" stroke-width="1.25" marker-end="url(#paperArrow)" stroke-dasharray="7 5"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="600" font-style="normal" fill="#111111" text-anchor="middle"><tspan x="660.0" y="990.0">5  retry(failure)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" font-style="normal" fill="#333333" text-anchor="start"><tspan x="50.0" y="1060.0">MESSAGE TRACE</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" font-style="normal" fill="#111111" text-anchor="start"><tspan x="280.0" y="1060.0">1 execute(attempt) → 2 write(reflection) → 3 index(feedback) → 4 retrieve(context) → 5 retry(failure)</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#555555" text-anchor="start"><tspan x="50.0" y="1110.0">Evidence: 1/41 repositories, 1/36 families; 1 trajectories (1 multi-checkpoint); exact audit: 1 supported, 0 unresolved, 0 rejected.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#555555" text-anchor="start"><tspan x="50.0" y="1136.0">Variation: Reflexion, episodic memory, observational memory, and project notes.</tspan></text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#555555" text-anchor="start"><tspan x="50.0" y="1164.0">Negative control: A generic conversation history is not a reflection-memory contract.</tspan></text></svg>