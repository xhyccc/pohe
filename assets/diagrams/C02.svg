93" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="793" width="5" height="70" rx="0" fill="#397455" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="815" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="843" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ChangeEvent</text><line x1="748" y1="863" x2="1052" y2="863" stroke="#17232D" stroke-width="1.1"/><text x="766" y="887" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="913" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ create(change)</text></g><g class="class-node" data-participant="NotificationBus" data-role="NotificationBus" data-layer="1"><rect x="966" y="485" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="966" y="485" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="966" y="485" width="5" height="70" rx="0" fill="#397455" stroke="none" stroke-width="1.2" class="class-accent"/><text x="984" y="507" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="984" y="535" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">NotificationBus</text><line x1="966" y1="555" x2="1270" y2="555" stroke="#17232D" stroke-width="1.1"/><text x="984" y="579" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="984" y="605" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ notify(event)</text></g><g class="dependency-badge"><circle cx="809.23" cy="410.4" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="809.23" y="414.4" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="900" cy="1016" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="900" y="1020" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="794.54" cy="718" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="794.54" y="722" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="900" cy="445" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="900" y="449" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1009" cy="405" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="1009" y="409" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="756.99" cy="373.42" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="756.99" y="377.42" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="1287" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1287" width="5" height="209" rx="0" fill="#397455" stroke="none" stroke-width="1.2"/><text x="74" y="1317" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="1347" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1347">A subject changes state or emits lifecycle information.</tspan></text><text x="74" y="1381" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1381">The subject publishes a change notification.</tspan></text><text x="74" y="1415" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1415">Subscription registry, event payload, and observer callbacks.</tspan></text><text x="74" y="1449" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1449">Currently registered observers are notified under declared ordering</tspan><tspan x="210" y="1470">semantics.</tspan></text><rect x="910" y="1287" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1287" width="5" height="209" rx="0" fill="#397455" stroke="none" stroke-width="1.2"/><text x="928" y="1317" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="1347" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1347">Observer identity and subscription lifetime are defined.</tspan></text><text x="928" y="1381" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1381">Notification follows the event and unsubscribed observers no longer receive</tspan><tspan x="1064" y="1402">it.</tspan></text><text x="928" y="1436" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1436">Observer failure does not corrupt subject state.</tspan></text><text x="928" y="1470" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1470">Callback errors and cascades are isolated or propagated by explicit policy.</tspan></text><rect x="56" y="1516" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1516" width="5" height="210" rx="0" fill="#397455" stroke="none" stroke-width="1.2"/><text x="74" y="1546" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1546" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1572">1 Observer → SubscriptionRegistry register(callback)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1595">2 Subject → ChangeEvent create(change)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1618">3 ChangeEvent → SubscriptionRegistry publish(event)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1641">4 SubscriptionRegistry → NotificationBus notify(event)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1664">5 NotificationBus → Observer deliver(event)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1687">6 Observer ↩ SubscriptionRegistry acknowledge(result)</tspan></text><rect x="910" y="1516" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1516" width="5" height="210" rx="0" fill="#397455" stroke="none" stroke-width="1.2"/><text x="928" y="1546" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1576" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1576">Event emitter, listener, hooks, and stream observers.</tspan></text><text x="928" y="1610" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1610">Test subscribe, unsubscribe, ordering, callback error, and reentrancy.</tspan></text><text x="928" y="1644" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1644">Polling the subject rather than notification is not the observer pointcut.</tspan></text></svg>