<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1084" width="183mm" height="110.21mm" role="img" data-diagram-type="uml-class" data-pattern-id="W04" aria-labelledby="title-W04 desc-W04"><title id="title-W04">W04: Orchestrator-workers</title><desc id="desc-W04">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#9A681D" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1084" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">W04  Orchestrator-workers</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#9A681D" text-anchor="start">Workflow / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Generate and delegate subtasks dynamically.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="Application" data-target="Orchestrator" data-numbers="1" data-messages="submit(goal)"><path d="M 718 261 Q 733 231 748 261" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="Orchestrator" data-target="TaskDecomposer" data-numbers="2" data-messages="decompose(goal)"><path d="M 1052 261 Q 1067 261 1082 261" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="TaskDecomposer" data-target="Worker" data-numbers="3" data-messages="assign(subtask)"><path d="M 1082 327.14 Q 939.61 269.14 885 412.86" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="Worker" data-target="ResultSynthesizer" data-numbers="4" data-messages="return(result)"><path d="M 885 479 Q 900 479 915 479" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ResultSynthesizer" data-target="Orchestrator" data-numbers="5" data-messages="synthesize(results)"><path d="M 1010.31 405 Q 987.33 375 964.35 345" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="Orchestrator" data-target="Application" data-numbers="6" data-messages="return(answer)"><path d="M 748 261 Q 733 291 718 261" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="class-node" data-participant="Application" data-role="Application" data-layer="0"><rect x="414" y="187" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="414" y="187" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="414" y="187" width="5" height="70" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="432" y="209" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="432" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Application</text><line x1="414" y1="257" x2="718" y2="257" stroke="#17232D" stroke-width="1.1"/><text x="432" y="281" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="432" y="307" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" fill="#536471" text-anchor="start" class="class-operation">(no incoming operation)</text></g><g class="class-node" data-participant="Orchestrator" data-role="Orchestrator" data-layer="0"><rect x="748" y="177" width="304" height="168" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="177" width="5" height="70" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="199" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Orchestrator</text><line x1="748" y1="247" x2="1052" y2="247" stroke="#17232D" stroke-width="1.1"/><text x="766" y="271" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="297" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ submit(goal)</text><text x="766" y="318" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ synthesize(results)</text></g><g class="class-node" data-participant="TaskDecomposer" data-role="TaskDecomposer" data-layer="0"><rect x="1082" y="187" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="1082" y="187" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="1082" y="187" width="5" height="70" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="1100" y="209" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="1100" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">TaskDecomposer</text><line x1="1082" y1="257" x2="1386" y2="257" stroke="#17232D" stroke-width="1.1"/><text x="1100" y="281" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="1100" y="307" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ decompose(goal)</text></g><g class="class-node" data-participant="Worker" data-role="Worker" data-layer="1"><rect x="581" y="405" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="581" y="405" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="581" y="405" width="5" height="70" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="599" y="427" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="599" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Worker</text><line x1="581" y1="475" x2="885" y2="475" stroke="#17232D" stroke-width="1.1"/><text x="599" y="499" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="599" y="525" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ assign(subtask)</text></g><g class="class-node" data-participant="ResultSynthesizer" data-role="ResultSynthesizer" data-layer="1"><rect x="915" y="405" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="915" y="405" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="915" y="405" width="5" height="70" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="933" y="427" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ResultSynthesizer</text><line x1="915" y1="475" x2="1219" y2="475" stroke="#17232D" stroke-width="1.1"/><text x="933" y="499" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="933" y="525" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" fill="#536471" text-anchor="start" class="class-operation">(no incoming operation)</text></g><g class="dependency-badge"><circle cx="733" cy="273" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="733" y="277" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="1067" cy="234" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="1067" y="238" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="961.56" cy="319.57" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="961.56" y="323.57" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="900" cy="452" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="900" y="456" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="987.33" cy="375" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="987.33" y="379" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="733" cy="153" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="733" y="157" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">6</text></g><rect x="56" y="601" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="601" width="5" height="209" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2"/><text x="74" y="631" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="661" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="661">A lead agent can generate tasks rather than call a fixed pipeline.</tspan></text><text x="74" y="695" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="695">The orchestrator decomposes a goal or dispatches a subtask.</tspan></text><text x="74" y="729" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="729">Task plan, worker selection, delegation envelope, and synthesis step.</tspan></text><text x="74" y="763" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="763">Synthesized output accounts for generated task results and delegated</tspan><tspan x="210" y="784">authority.</tspan></text><rect x="910" y="601" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="601" width="5" height="209" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2"/><text x="928" y="631" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="661" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="661">Workers advertise capabilities and share a task/result protocol.</tspan></text><text x="928" y="695" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="695">Every dispatched task has a result or failure and the final answer links</tspan><tspan x="1064" y="716">them.</tspan></text><text x="928" y="750" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="750">Dynamic dispatch cannot create unbounded uncounted worker expansion.</tspan></text><text x="928" y="784" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="784">Unsplittable, failed, or duplicate work is reflected in synthesis.</tspan></text><rect x="56" y="830" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="830" width="5" height="210" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2"/><text x="74" y="860" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="860" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="886">1 Application → Orchestrator submit(goal)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="909">2 Orchestrator → TaskDecomposer decompose(goal)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="932">3 TaskDecomposer → Worker assign(subtask)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="955">4 Worker → ResultSynthesizer return(result)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="978">5 ResultSynthesizer → Orchestrator synthesize(results)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1001">6 Orchestrator → Application return(answer)</tspan></text><rect x="910" y="830" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="830" width="5" height="210" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2"/><text x="928" y="860" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="890" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="890">Planner-executor, manager-worker, sub-agent registry, and dynamic graph.</tspan></text><text x="928" y="924" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="924">Test decomposition quality, worker failure, duplicate task, and recursion cap.</tspan></text><text x="928" y="958" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="958">A fixed sequence of sub-agents is W01 rather than dynamic W04.</tspan></text></svg>