 fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="199" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">CurrentHarness</text><line x1="748" y1="247" x2="1052" y2="247" stroke="#17232D" stroke-width="1.1"/><text x="766" y="271" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="297" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ compose(next)</text></g><g class="class-node" data-participant="ProposalGenerator" data-role="ProposalGenerator" data-layer="1"><rect x="530" y="475" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="530" y="475" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="530" y="475" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="548" y="497" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="548" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ProposalGenerator</text><line x1="530" y1="545" x2="834" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="548" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="548" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ propose(trace)</text></g><g class="class-node" data-participant="ProbeRunner" data-role="ProbeRunner" data-layer="2"><rect x="530" y="773" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="530" y="773" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="530" y="773" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="548" y="795" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="548" y="823" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ProbeRunner</text><line x1="530" y1="843" x2="834" y2="843" stroke="#17232D" stroke-width="1.1"/><text x="548" y="867" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="548" y="893" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ run(probe)</text></g><g class="class-node" data-participant="Evaluator" data-role="Evaluator" data-layer="2"><rect x="966" y="773" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="966" y="773" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="966" y="773" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="984" y="795" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="984" y="823" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Evaluator</text><line x1="966" y1="843" x2="1270" y2="843" stroke="#17232D" stroke-width="1.1"/><text x="984" y="867" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="984" y="893" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ evaluate(candidate)</text></g><g class="class-node" data-participant="Composer" data-role="Composer" data-layer="1"><rect x="966" y="475" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="966" y="475" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="966" y="475" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="984" y="497" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="984" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Composer</text><line x1="966" y1="545" x2="1270" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="984" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="984" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ select(edit)</text></g><g class="dependency-badge"><circle cx="791" cy="400" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="791" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="682" cy="698" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="682" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="743" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="900" y="747" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="1118" cy="698" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="1118" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1009" cy="400" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="1009" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="900" cy="445" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="900" y="449" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="969" width="834" height="188" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="969" width="5" height="188" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="74" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1029">A base harness is available for improvement.</tspan></text><text x="74" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1063">A proposal changes a bounded harness component and probes are executed.</tspan></text><text x="74" y="1097" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1097">Proposal scope, task probes, evaluator, and composition operation.</tspan></text><text x="74" y="1131" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1131">Only evidence-supported edits are composed into the next harness.</tspan></text><rect x="910" y="969" width="834" height="188" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="969" width="5" height="188" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="928" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1029">Harness components are addressable and probes use permitted data.</tspan></text><text x="928" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1063">Candidate edits carry probe results and composition provenance.</tspan></text><text x="928" y="1097" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1097">Evaluation data cannot be silently repurposed as final test data.</tspan></text><text x="928" y="1131" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1131">Failed probes, invalid edits, and conflicting changes remain uncomposed.</tspan></text><rect x="56" y="1177" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1177" width="5" height="210" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="74" y="1207" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1207" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1233">1 CurrentHarness → ProposalGenerator propose(trace)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1256">2 ProposalGenerator → ProbeRunner run(probe)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1279">3 ProbeRunner → Evaluator evaluate(candidate)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1302">4 Evaluator → Composer select(edit)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1325">5 Composer → CurrentHarness compose(next)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1348">6 Composer ↩ ProposalGenerator rollback(failure)</tspan></text><rect x="910" y="1177" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1177" width="5" height="210" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="928" y="1207" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1237" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1237">Contrastive probes, recursive improvement, and component-level editing.</tspan></text><text x="928" y="1271" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1271">Test accepted edit, rejected edit, leakage, and composition rollback.</tspan></text><text x="928" y="1305" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1305">A one-shot prompt rewrite without probes is not E02.</tspan></text></svg>