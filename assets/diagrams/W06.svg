<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1344" width="183mm" height="136.64mm" role="img" data-diagram-type="uml-class" data-pattern-id="W06" aria-labelledby="title-W06 desc-W06"><title id="title-W06">W06: Manager coordination</title><desc id="desc-W06">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#9A681D" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1344" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">W06  Manager coordination</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#9A681D" text-anchor="start">Workflow / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Keep a coordinating agent in control of specialists.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="Manager" data-target="SpecialistRegistry" data-numbers="1" data-messages="select(capability)"><path d="M 798.7 325 Q 733 373 667.3 421" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="SpecialistRegistry" data-target="Specialist" data-numbers="2" data-messages="return(specialist)"><path d="M 667.3 569 Q 733 617 798.7 665" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="Manager" data-target="TaskEnvelope" data-numbers="3" data-messages="delegate(task)"><path d="M 900 325 Q 900 373 900 421" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="TaskEnvelope" data-target="Specialist" data-numbers="4" data-messages="dispatch(task)"><path d="M 900 569 Q 900 617 900 665" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="Specialist" data-target="ResultIntegrator" data-numbers="5" data-messages="return(result)"><path d="M 1001.3 665 Q 1067 617 1132.7 569" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ResultIntegrator" data-target="Manager" data-numbers="6" data-messages="synthesize(results)"><path d="M 1132.7 421 Q 1067 373 1001.3 325" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="class-node" data-participant="Manager" data-role="Manager" data-layer="0"><rect x="748" y="177" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="177" width="5" height="70" rx="0" 