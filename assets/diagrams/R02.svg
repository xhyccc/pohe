<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 858" width="183mm" height="87.23mm" role="img" data-diagram-type="object-interaction" data-pattern-id="R02" aria-labelledby="title-R02 desc-R02"><title id="title-R02">R02: Verbal reflection memory</title><desc id="desc-R02">Analytical object interaction; not an observed execution trace.</desc><defs><marker id="filledArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#17232D"/></marker><marker id="openArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,0.8 L10,4.5 L1,8.2" fill="none" stroke="#795548" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1800" height="858" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="48" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">R02  Verbal reflection memory</text><text x="48" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#6D568D" text-anchor="start">Reasoning / OBJECT INTERACTION / ANALYTICAL COLLABORATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="48" y="105">Reuse feedback across attempts.</tspan></text><text x="48" y="146" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">OBJECT INTERACTION</text><text x="1752" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">solid arrow: call/message · dashed open arrow: return/failure · analytical order, not an observed trace</text><g class="participant" data-participant="Attempt" data-role="Attempt" data-instance="attempt"><rect x="78.4" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="78.4" y="166" width="5" height="64" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="218.4" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">attempt</text><text x="218.4" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:Attempt</text><line class="lifeline" x1="218.4" y1="230" x2="218.4" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="212.4" y="278" width="12" height="244" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="ReflectionProducer" data-role="ReflectionProducer" data-instance="reflectionProducer"><rect x="419.2" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="419.2" y="166" width="5" height="64" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="559.2" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">reflectionProducer</text><text x="559.2" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:ReflectionProducer</text><line class="lifeline" x1="559.2" y1="230" x2="559.2" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="553.2" y="278" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="ReflectionMemory" data-role="ReflectionMemory" data-instance="reflectionMemory"><rect x="760" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="760" y="166" width="5" height="64" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="900" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">reflectionMemory</text><text x="900" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:ReflectionMemory</text><line class="lifeline" x1="900" y1="230" x2="900" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="894" y="332" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="RetrievalPolicy" data-role="RetrievalPolicy" data-instance="retrievalPolicy"><rect x="1100.8" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1100.8" y="166" width="5" height="64" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="1240.8" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">retrievalPolicy</text><text x="1240.8" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:RetrievalPolicy</text><line class="lifeline" x1="1240.8" y1="230" x2="1240.8" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1234.8" y="386" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="NextAttempt" data-role="NextAttempt" data-instance="nextAttempt"><rect x="1441.6" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1441.6" y="166" width="5" height="64" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="1581.6" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">nextAttempt</text><text x="1581.6" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:NextAttempt</text><line class="lifeline" x1="1581.6" y1="230" x2="1581.6" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1575.6" y="440" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="message forward" data-number="1" data-source="Attempt" data-target="ReflectionProducer" data-message="execute(attempt)"><line x1="226.4" y1="292" x2="549.2" y2="292" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="293.5" y="264" width="190.6" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="388.8" y="280">1. execute(attempt)</tspan></text></g><g class="message forward" data-number="2" data-source="ReflectionProducer" data-target="ReflectionMemory" data-message="write(reflection)"><line x1="567.2" y1="346" x2="890" y2="346" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="629.6" y="318" width="200" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="729.6" y="334">2. write(reflection)</tspan></text></g><g class="message forward" data-number="3" data-source="ReflectionMemory" data-target="RetrievalPolicy" data-message="index(feedback)"><line x1="908" y1="400" x2="1230.8" y2="400" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="979.8" y="372" width="181.2" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1070.4" y="388">3. index(feedback)</tspan></text></g><g class="message forward" data-number="4" data-source="RetrievalPolicy" data-target="NextAttempt" data-message="retrieve(context)"><line x1="1248.8" y1="454" x2="1571.6" y2="454" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="1311.2" y="426" width="200" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1411.2" y="442">4. retrieve(context)</tspan></text></g><g class="message return-or-failure" data-number="5" data-source="NextAttempt" data-target="Attempt" data-message="retry(failure)"><line x1="1573.6" y1="508" x2="228.4" y2="508" stroke="#795548" stroke-width="1.5" marker-end="url(#openArrow)" stroke-dasharray="8 6"/><rect x="814.1" y="480" width="171.8" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#795548" text-anchor="middle" class="message-label"><tspan x="900" y="496">5. retry(failure)</tspan></text></g><rect x="48" y="598" width="842" height="194" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="66" y="626" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="66" y="656" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="656">An agent receives feedback that can inform later attempts.</tspan></text><text x="66" y="692" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="692">A failure or critique is verbalized and stored.</tspan></text><text x="66" y="728" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="728">Reflection producer, retrieval key, memory scope, and update policy.</tspan></text><text x="66" y="764" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="764">A later attempt retrieves attributable feedback and uses it in context.</tspan></text><rect x="910" y="598" width="842" height="194" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="928" y="626" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="656" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="656">Attempt and feedback identities are linked.</tspan></text><text x="928" y="692" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="692">Retrieved reflection retains source and remains updateable or revocable.</tspan></text><text x="928" y="728" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="728">Reflected explanations are not promoted to verified facts.</tspan></text><text x="928" y="764" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="764">Contradictory or poisoned reflections are filtered or explicit.</tspan></text><text x="48" y="823" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="400" fill="#536471" text-anchor="start">Sources: protocol/pattern_diagram_models.yaml (participants + messages); protocol/harness_pattern_specification.yaml (pointcut + contract).</text><text x="48" y="844" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="start">Analytical collaboration only; no repository execution or message order is asserted.</text></svg>