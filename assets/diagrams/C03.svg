"1.2" class="class-accent"/><text x="766" y="795" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="823" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">DeliveryPolicy</text><line x1="748" y1="843" x2="1052" y2="843" stroke="#17232D" stroke-width="1.1"/><text x="766" y="867" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="893" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ apply(delivery)</text></g><g class="class-node" data-participant="Subscriber" data-role="Subscriber" data-layer="2"><rect x="1184" y="773" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="1184" y="773" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="1184" y="773" width="5" height="70" rx="0" fill="#397455" stroke="none" stroke-width="1.2" class="class-accent"/><text x="1202" y="795" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="1202" y="823" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Subscriber</text><line x1="1184" y1="843" x2="1488" y2="843" stroke="#17232D" stroke-width="1.1"/><text x="1202" y="867" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="1202" y="893" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ deliver(event)</text></g><g class="dependency-badge"><circle cx="900" cy="400" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="900" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="671.84" cy="683.14" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="671.84" y="687.14" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="707.96" cy="735.98" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="707.96" y="739.98" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="900" cy="698" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="900" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1118" cy="743" r="14" fill="#FFFFFF" stroke="#397455" stroke-width="1.4"/><text x="1118" y="747" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#397455" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="1118" cy="698" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="1118" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="969" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="969" width="5" height="209" rx="0" fill="#397455" stroke="none" stroke-width="1.2"/><text x="74" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1029">Producers and consumers are decoupled through topics.</tspan></text><text x="74" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1063">A message is published to a topic.</tspan></text><text x="74" y="1097" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1097">Topic schema, broker or bus, subscribers, and delivery policy.</tspan></text><text x="74" y="1131" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1131">Matching subscribers receive the message under declared ordering and</tspan><tspan x="210" y="1152">durability rules.</tspan></text><rect x="910" y="969" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="969" width="5" height="209" rx="0" fill="#397455" stroke="none" stroke-width="1.2"/><text x="928" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1029">Topic identity and event compatibility are defined.</tspan></text><text x="928" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1063">Delivery or drop is observable and subscriber selection is attributable.</tspan></text><text x="928" y="1097" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1097">A subscriber cannot read a topic outside its authorization.</tspan></text><text x="928" y="1131" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1131">Duplicate, late, or lost delivery follows an explicit semantic contract.</tspan></text><rect x="56" y="1198" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1198" width="5" height="210" rx="0" fill="#397455" stroke="none" stroke-width="1.2"/><text x="74" y="1228" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1228" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1254">1 Publisher → TopicBus publish(event)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1277">2 TopicBus → SubscriptionRegistry lookup(topic)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1300">3 SubscriptionRegistry ↩ TopicBus return(subscribers)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1323">4 TopicBus → DeliveryPolicy apply(delivery)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1346">5 DeliveryPolicy → Subscriber deliver(event)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1369">6 Subscriber ↩ TopicBus acknowledge(result)</tspan></text><rect x="910" y="1198" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1198" width="5" height="210" rx="0" fill="#397455" stroke="none" stroke-width="1.2"/><text x="928" y="1228" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1258" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1258">In-process bus, OS socket pubsub, cloud queue, and durable stream.</tspan></text><text x="928" y="1292" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1292">Test multi-subscriber delivery, no subscriber, disconnect, duplicate, and auth.</tspan></text><text x="928" y="1326" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1326">Directly invoking known listeners is C02 rather than C03.</tspan></text></svg>