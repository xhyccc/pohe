<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1344" width="183mm" height="136.64mm" role="img" data-diagram-type="uml-class" data-pattern-id="E07" aria-labelledby="title-E07 desc-E07"><title id="title-E07">E07: Evaluator-guided program search</title><desc id="desc-E07">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#9A5134" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1344" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">E07  Evaluator-guided program search</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#9A5134" text-anchor="start">Evolution / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Evolve executable candidates.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="ProgramGenerator" data-target="CandidateProgram" data-numbers="1" data-messages="generate(program)"><path d="M 849.35 325 Q 816.5 373 783.65 421" fill="none" stroke="#9A5134" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="CandidateProgram" data-target="ExecutionEngine" data-numbers="2" data-messages="execute(program)"><path d="M 733 569 Q 733 617 733 665" fill="none" stroke="#9A5134" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ExecutionEngine" data-target="FitnessEvaluator" data-numbers="3" data-messages="measure(fitness)"><path d="M 885 739 Q 900 739 915 739" fill="none" stroke="#9A5134" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="FitnessEvaluator" data-target="SelectionLoop" data-numbers="4" data-messages="rank(candidate)"><path d="M 1067 665 Q 1067 617 1067 569" fill="none" stroke="#9A5134" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="SelectionLoop" data-target="ProgramGenerator" data-numbers="5" data-messages="breed(next)"><path d="M 1016.35 421 Q 983.5 373 950.65 325" fill="none" stroke="#9A5134" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency return-or-failure" data-source="SelectionLoop" data-target="CandidateProgram" data-numbers="6" data-messages="archive(best)"><path d="M 915 495 Q 900 495 885 495" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="class-node" data-participant="ProgramGenerator" data-role="ProgramGenerator" data-layer="0"><rect x="748" y="177" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="177" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="199" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ProgramGenerator</text><line x1="748" y1="247" x2="1052" y2="247" stroke="#17232D" stroke-width="1.1"/><text x="766" y="271" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="297" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ breed(next)</text></g><g class="class-node" data-participant="CandidateProgram" data-role="CandidateProgram" data-layer="1"><rect x="581" y="421" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="581" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="581" y="421" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="599" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="599" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">CandidateProgram</text><line x1="581" y1="491" x2="885" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="599" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="599" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ generate(program)</text></g><g class="class-node" data-participant="ExecutionEngine" data-role="ExecutionEngine" data-layer="2"><rect x="581" y="665" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="581" y="665" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="581" y="665" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="599" y="687" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="599" y="715" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ExecutionEngine</text><line x1="581" y1="735" x2="885" y2="735" stroke="#17232D" stroke-width="1.1"/><text x="599" y="759" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="599" y="785" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ execute(program)</text></g><g class="class-node" data-participant="FitnessEvaluator" data-role="FitnessEvaluator" data-layer="2"><rect x="915" y="665" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="915" y="665" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="915" y="665" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="933" y="687" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="715" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">FitnessEvaluator</text><line x1="915" y1="735" x2="1219" y2="735" stroke="#17232D" stroke-width="1.1"/><text x="933" y="759" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="933" y="785" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ measure(fitness)</text></g><g class="class-node" data-participant="SelectionLoop" data-role="SelectionLoop" data-layer="1"><rect x="915" y="421" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="915" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="915" y="421" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="933" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">SelectionLoop</text><line x1="915" y1="491" x2="1219" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="933" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="933" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ rank(candidate)</text></g><g class="dependency-badge"><circle cx="816.5" cy="373" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="816.5" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="733" cy="617" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="733" y="621" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="712" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="900" y="716" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="1067" cy="617" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="1067" y="621" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="983.5" cy="373" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="983.5" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="900" cy="468" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="900" y="472" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="861" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="861" width="5" height="209" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="74" y="891" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="921" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="921">Harness or harness-adjacent behavior is represented as executable programs.</tspan></text><text x="74" y="955" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="955">Candidate programs are generated, mutated, or selected.</tspan></text><text x="74" y="989" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="989">Generator, executor, fitness evaluator, archive, and next-generation policy.</tspan></text><text x="74" y="1023" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1023">A next generation is selected from measured executable candidates.</tspan></text><rect x="910" y="861" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="861" width="5" height="209" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="928" y="891" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="921" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="921">Candidate runtime and evaluation suite are isolated and available.</tspan></text><text x="928" y="955" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="955">Every selected candidate has execution and fitness provenance.</tspan></text><text x="928" y="989" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="989">Evaluation budget and security boundaries hold across all candidates.</tspan></text><text x="928" y="1023" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1023">Crash, timeout, unsafe code, or invalid fitness removes or quarantines</tspan><tspan x="1064" y="1044">candidate.</tspan></text><rect x="56" y="1090" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1090" width="5" height="210" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="74" y="1120" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1120" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1146">1 ProgramGenerator → CandidateProgram generate(program)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1169">2 CandidateProgram → ExecutionEngine execute(program)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1192">3 ExecutionEngine → FitnessEvaluator measure(fitness)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1215">4 FitnessEvaluator → SelectionLoop rank(candidate)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1238">5 SelectionLoop → ProgramGenerator breed(next)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1261">6 SelectionLoop ↩ CandidateProgram archive(best)</tspan></text><rect x="910" y="1090" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1090" width="5" height="210" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="928" y="1120" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1150" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1150">AlphaEvolve-like search, evolutionary archive, program mutation, and fitness gates.</tspan></text><text x="928" y="1184" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1184">Test execution, unsafe candidate, timeout, fitness error, and generation update.</tspan></text><text x="928" y="1218" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1218">Prompt-level variation with no executable search is not E07.</tspan></text></svg>