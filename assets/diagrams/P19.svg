nt-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">BudgetController</text><line x1="748" y1="545" x2="1052" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="766" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ report(usage)</text></g><g class="class-node" data-participant="TerminationPolicy" data-role="TerminationPolicy" data-layer="1"><rect x="1184" y="475" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="1184" y="475" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="1184" y="475" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="1202" y="497" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="1202" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">TerminationPolicy</text><line x1="1184" y1="545" x2="1488" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="1202" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="1202" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ evaluate(cap)</text></g><g class="dependency-badge"><circle cx="682" cy="400" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="682" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="682" cy="698" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="682" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="698" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="900" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="1118" cy="445" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="1118" y="449" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1118" cy="400" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="1118" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="900" cy="400" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="900" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">6</text></g><rect x="56" y="969" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="969" width="5" height="209" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="74" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1029">The harness can consume bounded turns, steps, tokens, time, or cost.</tspan></text><text x="74" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1063">Accounting approaches or exceeds a configured cap.</tspan></text><text x="74" y="1097" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1097">Resource ledger, cap policy, terminal reason, and optional escalation.</tspan></text><text x="74" y="1131" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1131">Execution stops or changes policy before an unaccounted resource overrun.</tspan></text><rect x="910" y="969" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="969" width="5" height="209" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="928" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1029">Relevant resource use is observable and shared with delegated work.</tspan></text><text x="928" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1063">Exhaustion produces a distinct terminal outcome and records the responsible</tspan><tspan x="1064" y="1084">cap.</tspan></text><text x="928" y="1118" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1118">Budget exhaustion is never reported as task success.</tspan></text><text x="928" y="1152" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1152">Missing accounting or handler failure falls back to a safe terminal policy.</tspan></text><rect x="56" y="1198" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1198" width="5" height="210" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="74" y="1228" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1228" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1254">1 Agent → WorkQueue enqueue(work)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1277">2 WorkQueue → ResourceMeter account(work)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1300">3 ResourceMeter → BudgetController report(usage)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1323">4 BudgetController → TerminationPolicy evaluate(cap)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1346">5 TerminationPolicy ↩ Agent stop_or_escalate()</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1369">6 BudgetController → Agent continue(allowance)</tspan></text><rect x="910" y="1198" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1198" width="5" height="210" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="928" y="1228" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1258" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1258">Step, turn, token, cost, wall-clock, delegation, and per-task budgets.</tspan></text><text x="928" y="1292" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1292">Test exact cap, overshoot, parallel accounting, child work, and custom handler.</tspan></text><text x="928" y="1326" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1326">A constant limit in an unrelated library does not meet the pointcut.</tspan></text></svg>