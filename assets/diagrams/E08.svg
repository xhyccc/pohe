<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 988" width="183mm" height="100.45mm" role="img" data-diagram-type="object-interaction" data-pattern-id="E08" aria-labelledby="title-E08 desc-E08"><title id="title-E08">E08: On-demand adaptation target selection</title><desc id="desc-E08">Analytical object interaction; not an observed execution trace.</desc><defs><marker id="filledArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#17232D"/></marker><marker id="openArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,0.8 L10,4.5 L1,8.2" fill="none" stroke="#795548" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1800" height="988" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="48" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">E08  On-demand adaptation target selection</text><text x="48" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#9A5134" text-anchor="start">Evolution / OBJECT INTERACTION / ANALYTICAL COLLABORATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="48" y="105">Choose harness versus weight adaptation.</tspan></text><text x="48" y="146" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">OBJECT INTERACTION</text><text x="1752" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">solid arrow: call/message · dashed open arrow: return/failure · analytical order, not an observed trace</text><g class="participant" data-participant="TaskState" data-role="TaskState" data-instance="taskState"><rect x="57" y="166" width="266" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="57" y="166" width="5" height="64" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="190" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">taskState</text><text x="190" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:TaskState</text><line class="lifeline" x1="190" y1="230" x2="190" y2="672" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="184" y="278" width="12" height="28" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="AdaptationController" data-role="AdaptationController" data-instance="adaptationController"><rect x="341" y="166" width="266" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="341" y="166" width="5" height="64" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="474" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">adaptationController</text><text x="474" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:AdaptationController</text><line class="lifeline" x1="474" y1="230" x2="474" y2="672" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="468" y="278" width="12" height="352" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="HarnessCandidate" data-role="HarnessCandidate" data-instance="harnessCandidate"><rect x="625" y="166" width="266" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="625" y="166" width="5" height="64" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="758" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">harnessCandidate</text><text x="758" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:HarnessCandidate</text><line class="lifeline" x1="758" y1="230" x2="758" y2="672" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="752" y="332" width="12" height="136" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="WeightCandidate" data-role="WeightCandidate" data-instance="weightCandidate"><rect x="909" y="166" width="266" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="909" y="166" width="5" height="64" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="1042" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">weightCandidate</text><text x="1042" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:WeightCandidate</text><line class="lifeline" x1="1042" y1="230" x2="1042" y2="672" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1036" y="386" width="12" height="136" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="EvaluationFeedback" data-role="EvaluationFeedback" data-instance="evaluationFeedback"><rect x="1193" y="166" width="266" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1193" y="166" width="5" height="64" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="1326" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">evaluationFeedback</text><text x="1326" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:EvaluationFeedback</text><line class="lifeline" x1="1326" y1="230" x2="1326" y2="672" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1320" y="440" width="12" height="190" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="SelectedTarget" data-role="SelectedTarget" data-instance="selectedTarget"><rect x="1477" y="166" width="266" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1477" y="166" width="5" height="64" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="1610" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">selectedTarget</text><text x="1610" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:SelectedTarget</text><line class="lifeline" x1="1610" y1="230" x2="1610" y2="672" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1604" y="548" width="12" height="28" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="message forward" data-number="1" data-source="TaskState" data-target="AdaptationController" data-message="observe(trace)"><line x1="198" y1="292" x2="464" y2="292" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="246.1" y="264" width="171.8" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="332" y="280">1. observe(trace)</tspan></text></g><g class="message forward" data-number="2" data-source="AdaptationController" data-target="HarnessCandidate" data-message="propose(harness)"><line x1="482" y1="346" x2="748" y2="346" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="520.7" y="318" width="190.6" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="616" y="334">2. propose(harness)</tspan></text></g><g class="message forward" data-number="3" data-source="AdaptationController" data-target="WeightCandidate" data-message="propose(weights)"><line x1="482" y1="400" x2="1032" y2="400" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="662.7" y="372" width="190.6" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="758" y="388">3. propose(weights)</tspan></text></g><g class="message forward" data-number="4" data-source="HarnessCandidate" data-target="EvaluationFeedback" data-message="evaluate()"><line x1="766" y1="454" x2="1316" y2="454" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="974.9" y="426" width="134.2" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1042" y="442">4. evaluate()</tspan></text></g><g class="message forward" data-number="5" data-source="WeightCandidate" data-target="EvaluationFeedback" data-message="evaluate()"><line x1="1050" y1="508" x2="1316" y2="508" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="1116.9" y="480" width="134.2" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1184" y="496">5. evaluate()</tspan></text></g><g class="message forward" data-number="6" data-source="EvaluationFeedback" data-target="SelectedTarget" data-message="select(target)"><line x1="1334" y1="562" x2="1600" y2="562" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="1382.1" y="534" width="171.8" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1468" y="550">6. select(target)</tspan></text></g><g class="message return-or-failure" data-number="7" data-source="EvaluationFeedback" data-target="AdaptationController" data-message="rollback(failure)"><line x1="1318" y1="616" x2="484" y2="616" stroke="#795548" stroke-width="1.5" marker-end="url(#openArrow)" stroke-dasharray="8 6"/><rect x="800" y="588" width="200" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#795548" text-anchor="middle" class="message-label"><tspan x="900" y="604">7. rollback(failure)</tspan></text></g><rect x="48" y="706" width="842" height="216" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="66" y="734" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="66" y="764" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="764">An embodied agent encounters a task or distribution shift.</tspan></text><text x="66" y="800" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="800">An adaptation controller evaluates task performance and cost.</tspan></text><text x="66" y="836" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="836">Adaptation target policy, harness and weight candidates, and evaluation</tspan><tspan x="164" y="858">feedback.</tspan></text><text x="66" y="894" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="894">The controller selects a declared adaptation target and records why.</tspan></text><rect x="910" y="706" width="842" height="216" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="928" y="734" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="764" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="764">Task state, candidate adaptation targets, and cost or risk are observable.</tspan></text><text x="928" y="800" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="800">The selected target is compatible with the current execution environment.</tspan></text><text x="928" y="836" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="836">Adaptation does not silently combine targets outside the declared policy.</tspan></text><text x="928" y="872" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="872">Unsupported target or uncertain evidence falls back to a safe target or no</tspan><tspan x="1026" y="894">adaptation.</tspan></text><text x="48" y="953" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="400" fill="#536471" text-anchor="start">Sources: protocol/pattern_diagram_models.yaml (participants + messages); protocol/harness_pattern_specification.yaml (pointcut + contract).</text><text x="48" y="974" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="start">Analytical collaboration only; no repository execution or message order is asserted.</text></svg>