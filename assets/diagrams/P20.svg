<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" width="183mm" height="89.47mm" role="img" data-diagram-type="object-interaction" data-pattern-id="P20" aria-labelledby="title-P20 desc-P20"><title id="title-P20">P20: Reflection-augmented loop</title><desc id="desc-P20">Analytical object interaction; not an observed execution trace.</desc><defs><marker id="filledArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#17232D"/></marker><marker id="openArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,0.8 L10,4.5 L1,8.2" fill="none" stroke="#795548" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1800" height="880" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="48" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">P20  Reflection-augmented loop</text><text x="48" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#2F6F8F" text-anchor="start">Primitive / OBJECT INTERACTION / ANALYTICAL COLLABORATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="48" y="105">Use feedback to revise attempts.</tspan></text><text x="48" y="146" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">OBJECT INTERACTION</text><text x="1752" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">solid arrow: call/message · dashed open arrow: return/failure · analytical order, not an observed trace</text><g class="participant" data-participant="Agent" data-role="Agent" data-instance="agent"><rect x="78.4" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="78.4" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="218.4" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">agent</text><text x="218.4" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:Agent</text><line class="lifeline" x1="218.4" y1="230" x2="218.4" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="212.4" y="278" width="12" height="244" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="Attempt" data-role="Attempt" data-instance="attempt"><rect x="419.2" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="419.2" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="559.2" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">attempt</text><text x="559.2" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:Attempt</text><line class="lifeline" x1="559.2" y1="230" x2="559.2" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="553.2" y="278" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="CritiqueLoop" data-role="CritiqueLoop" data-instance="critiqueLoop"><rect x="760" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="760" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="900" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">critiqueLoop</text><text x="900" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:CritiqueLoop</text><line class="lifeline" x1="900" y1="230" x2="900" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="894" y="332" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="Evaluator" data-role="Evaluator" data-instance="evaluator"><rect x="1100.8" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1100.8" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="1240.8" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">evaluator</text><text x="1240.8" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:Evaluator</text><line class="lifeline" x1="1240.8" y1="230" x2="1240.8" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1234.8" y="386" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="RetryPolicy" data-role="RetryPolicy" data-instance="retryPolicy"><rect x="1441.6" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1441.6" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="1581.6" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">retryPolicy</text><text x="1581.6" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:RetryPolicy</text><line class="lifeline" x1="1581.6" y1="230" x2="1581.6" y2="564" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1575.6" y="440" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="message forward" data-number="1" data-source="Agent" data-target="Attempt" data-message="propose(attempt)"><line x1="226.4" y1="292" x2="549.2" y2="292" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="293.5" y="264" width="190.6" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="388.8" y="280">1. propose(attempt)</tspan></text></g><g class="message forward" data-number="2" data-source="Attempt" data-target="CritiqueLoop" data-message="request(critique)"><line x1="567.2" y1="346" x2="890" y2="346" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="629.6" y="318" width="200" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="729.6" y="334">2. request(critique)</tspan></text></g><g class="message forward" data-number="3" data-source="CritiqueLoop" data-target="Evaluator" data-message="evaluate(attempt)"><line x1="908" y1="400" x2="1230.8" y2="400" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="970.4" y="372" width="200" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1070.4" y="388">3. evaluate(attempt)</tspan></text></g><g class="message forward" data-number="4" data-source="Evaluator" data-target="RetryPolicy" data-message="feedback(result)"><line x1="1248.8" y1="454" x2="1571.6" y2="454" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="1315.9" y="426" width="190.6" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1411.2" y="442">4. feedback(result)</tspan></text></g><g class="message return-or-failure" data-number="5" data-source="RetryPolicy" data-target="Agent" data-message="revise(retry)"><line x1="1573.6" y1="508" x2="228.4" y2="508" stroke="#795548" stroke-width="1.5" marker-end="url(#openArrow)" stroke-dasharray="8 6"/><rect x="818.8" y="480" width="162.4" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#795548" text-anchor="middle" class="message-label"><tspan x="900" y="496">5. revise(retry)</tspan></text></g><rect x="48" y="598" width="842" height="216" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="66" y="626" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="66" y="656" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="656">An attempt can be evaluated before a further attempt.</tspan></text><text x="66" y="692" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="692">The attempt fails or receives a critique.</tspan></text><text x="66" y="728" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="728">Attempt record, feedback producer, revision input, and retry bound.</tspan></text><text x="66" y="764" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="764">A revised attempt uses recorded feedback while preserving attempt lineage.</tspan></text><rect x="910" y="598" width="842" height="216" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="928" y="626" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="656" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="656">Failure evidence and remaining retry budget are available.</tspan></text><text x="928" y="692" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="692">Feedback is attached to the attempt that produced it and is visible to</tspan><tspan x="1026" y="714">revision.</tspan></text><text x="928" y="750" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="750">Self-critique is not represented as independent verification.</tspan></text><text x="928" y="786" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="786">Empty, contradictory, or exhausted feedback terminates or escalates.</tspan></text><text x="48" y="845" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="400" fill="#536471" text-anchor="start">Sources: protocol/pattern_diagram_models.yaml (participants + messages); protocol/harness_pattern_specification.yaml (pointcut + contract).</text><text x="48" y="866" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="start">Analytical collaboration only; no repository execution or message order is asserted.</text></svg>