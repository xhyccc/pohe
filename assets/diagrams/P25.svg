OPERATIONS / RECEIVED CALLS</text><text x="432" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ resolve(capability)</text></g><g class="class-node" data-participant="CapabilityProfile" data-role="CapabilityProfile" data-layer="2"><rect x="748" y="665" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="665" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="665" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="687" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="715" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">CapabilityProfile</text><line x1="748" y1="735" x2="1052" y2="735" stroke="#17232D" stroke-width="1.1"/><text x="766" y="759" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="785" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ load(profile)</text></g><g class="class-node" data-participant="Authorizer" data-role="Authorizer" data-layer="1"><rect x="748" y="421" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="421" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Authorizer</text><line x1="748" y1="491" x2="1052" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="766" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ check(scope)</text></g><g class="class-node" data-participant="Tool" data-role="Tool" data-layer="1"><rect x="1082" y="421" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="1082" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="1082" y="421" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="1100" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="1100" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Tool</text><line x1="1082" y1="491" x2="1386" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="1100" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="1100" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ invoke(scoped_call)</text></g><g class="dependency-badge"><circle cx="733" cy="373" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="733" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="733" cy="617" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="733" y="621" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="617" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="900" y="621" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="1067" cy="468" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="1067" y="472" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1067" cy="373" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="1067" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="900" cy="373" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="900" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="861" width="834" height="251" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="861" width="5" height="251" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="74" y="891" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="921" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="921">A caller invokes a method or service with an operator, session, or agent</tspan><tspan x="210" y="942">identity.</tspan></text><text x="74" y="976" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="976">Capability is checked against a requested scope.</tspan></text><text x="74" y="1010" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1010">Scope identity, profile, grant and revocation state, and resolution</tspan><tspan x="210" y="1031">function.</tspan></text><text x="74" y="1065" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1065">The call is permitted only if the principal currently holds a covering</tspan><tspan x="210" y="1086">scope.</tspan></text><rect x="910" y="861" width="834" height="251" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="861" width="5" height="251" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="928" y="891" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="921" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="921">Principal identity and requested capability are explicit.</tspan></text><text x="928" y="955" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="955">Authorization is evaluated at the call boundary and records the covering</tspan><tspan x="1064" y="976">scope.</tspan></text><text x="928" y="1010" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1010">Scopes are not inherited beyond declared containment or lifetime.</tspan></text><text x="928" y="1044" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1044">Missing, expired, revoked, or cross-scope capabilities are denied</tspan><tspan x="1064" y="1065">explicitly.</tspan></text><rect x="56" y="1132" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1132" width="5" height="210" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="74" y="1162" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1162" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1188">1 Agent → ScopeRegistry resolve(capability)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1211">2 ScopeRegistry → CapabilityProfile load(profile)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1234">3 CapabilityProfile → Authorizer check(scope)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1257">4 Authorizer → Tool invoke(scoped_call)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1280">5 Tool ↩ Agent return(result)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1303">6 Authorizer ↩ Agent deny(failure)</tspan></text><rect x="910" y="1132" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1132" width="5" height="210" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="928" y="1162" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1192" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1192">Method scopes, roles, session grants, profiles, and delegated identities.</tspan></text><text x="928" y="1226" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1226">Test widening, revocation, expiration, child agent, and cross-tenant access.</tspan></text><text x="928" y="1260" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1260">A boolean admin flag is not a scope model.</tspan></text></svg>