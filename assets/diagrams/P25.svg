<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1494" width="183mm" height="151.89mm" role="img" data-diagram-type="uml-class" data-pattern-id="P25" aria-labelledby="title-P25 desc-P25"><title id="title-P25">P25: Scope-based authorization and profiles</title><desc id="desc-P25">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#2F6F8F" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1494" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">P25  Scope-based authorization and profiles</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#2F6F8F" text-anchor="start">Primitive / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Bind capabilities to explicit scopes.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="Agent" data-target="ScopeRegistry" data-numbers="1" data-messages="resolve(capability)"><path d="M 791.73 325 Q 682 400 572.27 475" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ScopeRegistry" data-target="CapabilityProfile" data-numbers="2" data-messages="load(profile)"><path d="M 572.27 623 Q 682 698 791.73 773" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="CapabilityProfile" data-target="Authorizer" data-numbers="3" data-messages="check(scope)"><path d="M 900 773 Q 900 698 900 623" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="Authorizer" data-target="Tool" data-numbers="4" data-messages="invoke(scoped_call)"><path d="M 1052 549 Q 1118 549 1184 549" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency return-or-failure" data-source="Tool" data-target="Agent" data-numbers="5" data-messages="return(result)"><path d="M 1227.73 475 Q 1118 400 1008.27 325" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="dependency return-or-failure" data-source="Authorizer" data-target="Agent" data-numbers="6" data-messages="deny(failure)"><path d="M 900 475 Q 900 400 900 325" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="class-node" data-participant="Agent" data-role="Agent" data-layer="0"><rect x="748" y="177" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="177" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="199" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Agent</text><line x1="748" y1="247" x2="1052" y2="247" stroke="#17232D" stroke-width="1.1"/><text x="766" y="271" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="297" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" fill="#536471" text-anchor="start" class="class-operation">(no incoming operation)</text></g><g class="class-node" data-participant="ScopeRegistry" data-role="ScopeRegistry" data-layer="1"><rect x="312" y="475" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="312" y="475" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="312" y="475" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="330" y="497" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="330" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ScopeRegistry</text><line x1="312" y1="545" x2="616" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="330" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="330" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ resolve(capability)</text></g><g class="class-node" data-participant="CapabilityProfile" data-role="CapabilityProfile" data-layer="2"><rect x="748" y="773" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="773" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="773" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="795" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="823" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">CapabilityProfile</text><line x1="748" y1="843" x2="1052" y2="843" stroke="#17232D" stroke-width="1.1"/><text x="766" y="867" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="893" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ load(profile)</text></g><g class="class-node" data-participant="Authorizer" data-role="Authorizer" data-layer="1"><rect x="748" y="475" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="475" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="475" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="497" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Authorizer</text><line x1="748" y1="545" x2="1052" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="766" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ check(scope)</text></g><g class="class-node" data-participant="Tool" data-role="Tool" data-layer="1"><rect x="1184" y="475" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="1184" y="475" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="1184" y="475" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="1202" y="497" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="1202" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Tool</text><line x1="1184" y1="545" x2="1488" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="1202" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="1202" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ invoke(scoped_call)</text></g><g class="dependency-badge"><circle cx="682" cy="400" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="682" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="682" cy="698" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="682" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="698" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="900" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="1118" cy="445" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="1118" y="449" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1118" cy="400" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="1118" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="900" cy="400" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="900" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="969" width="834" height="251" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="969" width="5" height="251" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="74" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1029">A caller invokes a method or service with an operator, session, or agent</tspan><tspan x="210" y="1050">identity.</tspan></text><text x="74" y="1084" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1084">Capability is checked against a requested scope.</tspan></text><text x="74" y="1118" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1118">Scope identity, profile, grant and revocation state, and resolution</tspan><tspan x="210" y="1139">function.</tspan></text><text x="74" y="1173" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1173">The call is permitted only if the principal currently holds a covering</tspan><tspan x="210" y="1194">scope.</tspan></text><rect x="910" y="969" width="834" height="251" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="969" width="5" height="251" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="928" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1029">Principal identity and requested capability are explicit.</tspan></text><text x="928" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1063">Authorization is evaluated at the call boundary and records the covering</tspan><tspan x="1064" y="1084">scope.</tspan></text><text x="928" y="1118" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1118">Scopes are not inherited beyond declared containment or lifetime.</tspan></text><text x="928" y="1152" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1152">Missing, expired, revoked, or cross-scope capabilities are denied</tspan><tspan x="1064" y="1173">explicitly.</tspan></text><rect x="56" y="1240" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1240" width="5" height="210" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="74" y="1270" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1270" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1296">1 Agent → ScopeRegistry resolve(capability)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1319">2 ScopeRegistry → CapabilityProfile load(profile)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1342">3 CapabilityProfile → Authorizer check(scope)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1365">4 Authorizer → Tool invoke(scoped_call)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1388">5 Tool ↩ Agent return(result)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1411">6 Authorizer ↩ Agent deny(failure)</tspan></text><rect x="910" y="1240" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1240" width="5" height="210" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="928" y="1270" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1300" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1300">Method scopes, roles, session grants, profiles, and delegated identities.</tspan></text><text x="928" y="1334" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1334">Test widening, revocation, expiration, child agent, and cross-tenant access.</tspan></text><text x="928" y="1368" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1368">A boolean admin flag is not a scope model.</tspan></text></svg>