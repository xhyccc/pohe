th="1.2" class="class-accent"/><text x="933" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Router</text><line x1="915" y1="491" x2="1219" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="933" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="933" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ select(route)</text></g><g class="class-node" data-participant="EvaluationPolicy" data-role="EvaluationPolicy" data-layer="2"><rect x="915" y="665" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="915" y="665" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="915" y="665" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="933" y="687" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="715" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">EvaluationPolicy</text><line x1="915" y1="735" x2="1219" y2="735" stroke="#17232D" stroke-width="1.1"/><text x="933" y="759" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text