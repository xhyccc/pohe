<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1085" width="183mm" height="110.31mm" role="img" data-diagram-type="uml-class" data-pattern-id="P08" aria-labelledby="title-P08 desc-P08"><title id="title-P08">P08: Multi-provider transport abstraction</title><desc id="desc-P08">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#2F6F8F" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1085" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">P08  Multi-provider transport abstraction</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#2F6F8F" text-anchor="start">Primitive / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Swap model backends.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="Client" data-target="TransportAbstraction" data-numbers="1" data-messages="request(call)"><path d="M 718 251 Q 733 221 748 251" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="TransportAbstraction" data-target="ProviderAdapter" data-numbers="2" data-messages="resolve(provider)"><path d="M 1052 251 Q 1067 251 1082 251" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ProviderAdapter" data-target="RequestSchema" data-numbers="3" data-messages="map(request)"><path d="M 1082 314.11 Q 941.32 253.41 885 395.89" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="RequestSchema" data-target="ProviderService" data-numbers="4" data-messages="invoke(request)"><path d="M 885 459 Q 900 459 915 459" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency return-or-failure" data-source="ProviderService" data-target="TransportAbstraction" data-numbers="5" data-messages="return(response)"><path d="M 1007.59 385 Q 983.5 355 959.41 325" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="dependency forward" data-source="TransportAbstraction" data-target="Client" data-numbers="6" data-messages="return(result_or_error)"><path d="M 748 251 Q 733 281 718 251" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="class-node" data-participant="Client" data-role="Client" data-layer="0"><rect x="414" y="177" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="414" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect