<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1344" width="183mm" height="136.64mm" role="img" data-diagram-type="uml-class" data-pattern-id="P10" aria-labelledby="title-P10 desc-P10"><title id="title-P10">P10: Capped output and remediation errors</title><desc id="desc-P10">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#2F6F8F" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1344" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">P10  Capped output and remediation errors</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#2F6F8F" text-anchor="start">Primitive / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Bound observations while enabling recovery.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="ToolExecutor" data-target="OutputAdapter" data-numbers="1" data-messages="capture(output)"><path d="M 798.7 325 Q 733 373 667.3 421" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="OutputAdapter" data-target="ResultLimiter" data-numbers="2" data-messages="enforce(cap)"><path d="M 718 495 Q 733 495 748 495" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ResultLimiter" data-target="ArtifactStore" data-numbers="3" data-messages="store(full_output)"><path d="M 900 569 Q 900 617 900 665" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ResultLimiter" data-target="ToolExecutor" data-numbers="4" data-messages="return(bounded)"><path d="M 900 421 Q 900 373 900 325" fill="none" stroke="#2F6F8F" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency return-or-failure" data-source="ResultLimiter" data-target="RepairPolicy" data-numbers="5" data-messages="emit(remediation)"><path d="M 1052 495 Q 1067 495 1082 495" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="dependency return-or-failure" data-source="RepairPolicy" data-target="ToolExecutor" data-numbers="6" data-messages="revise(observation)"><path d="M 1132.7 421 Q 1067 373 1001.3 325" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="class-node" data-participant="ToolExecutor" data-role="ToolExecutor" data-layer="0"><rect x="748" y="177" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="177" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="199" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ToolExecutor</text><line x1="748" y1="247" x2="1052" y2="247" stroke="#17232D" stroke-width="1.1"/><text x="766" y="271" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="297" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" fill="#536471" text-anchor="start" class="class-operation">(no incoming operation)</text></g><g class="class-node" data-participant="OutputAdapter" data-role="OutputAdapter" data-layer="1"><rect x="414" y="421" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="414" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="414" y="421" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="432" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="432" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">OutputAdapter</text><line x1="414" y1="491" x2="718" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="432" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="432" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ capture(output)</text></g><g class="class-node" data-participant="ResultLimiter" data-role="ResultLimiter" data-layer="1"><rect x="748" y="421" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="421" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ResultLimiter</text><line x1="748" y1="491" x2="1052" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="766" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ enforce(cap)</text></g><g class="class-node" data-participant="ArtifactStore" data-role="ArtifactStore" data-layer="2"><rect x="748" y="665" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="665" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="665" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="687" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="715" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ArtifactStore</text><line x1="748" y1="735" x2="1052" y2="735" stroke="#17232D" stroke-width="1.1"/><text x="766" y="759" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="785" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ store(full_output)</text></g><g class="class-node" data-participant="RepairPolicy" data-role="RepairPolicy" data-layer="1"><rect x="1082" y="421" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="1082" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="1082" y="421" width="5" height="70" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2" class="class-accent"/><text x="1100" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="1100" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">RepairPolicy</text><line x1="1082" y1="491" x2="1386" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="1100" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="1100" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" fill="#536471" text-anchor="start" class="class-operation">(no incoming operation)</text></g><g class="dependency-badge"><circle cx="733" cy="373" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="733" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="733" cy="468" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="733" y="472" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="617" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="900" y="621" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="900" cy="373" r="14" fill="#FFFFFF" stroke="#2F6F8F" stroke-width="1.4"/><text x="900" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#2F6F8F" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1067" cy="468" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="1067" y="472" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="1067" cy="373" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="1067" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="861" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="861" width="5" height="209" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="74" y="891" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="921" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="921">A tool or environment can emit output larger than the context allowance.</tspan></text><text x="74" y="955" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="955">Output crosses a size or token cap.</tspan></text><text x="74" y="989" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="989">Limit policy, truncation metadata, and access to complete artifacts.</tspan></text><text x="74" y="1023" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1023">The harness returns a bounded observation with explicit recovery</tspan><tspan x="210" y="1044">information.</tspan></text><rect x="910" y="861" width="834" height="209" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="861" width="5" height="209" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="928" y="891" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="921" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="921">Output size is measurable and original content remains addressable.</tspan></text><text x="928" y="955" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="955">The consumer knows truncation occurred and can seek the full result.</tspan></text><text x="928" y="989" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="989">Truncation never masquerades as complete evidence.</tspan></text><text x="928" y="1023" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1023">Oversized or unavailable output returns a typed remediation error.</tspan></text><rect x="56" y="1090" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1090" width="5" height="210" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="74" y="1120" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1120" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1146">1 ToolExecutor → OutputAdapter capture(output)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1169">2 OutputAdapter → ResultLimiter enforce(cap)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1192">3 ResultLimiter → ArtifactStore store(full_output)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1215">4 ResultLimiter → ToolExecutor return(bounded)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1238">5 ResultLimiter ↩ RepairPolicy emit(remediation)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1261">6 RepairPolicy ↩ ToolExecutor revise(observation)</tspan></text><rect x="910" y="1090" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1090" width="5" height="210" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="928" y="1120" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1150" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1150">Character, line, token, structure-aware caps, summaries, and repair hints.</tspan></text><text x="928" y="1184" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1184">Test exact limit, over-limit, non-UTF8, complete-artifact retrieval, and retry.</tspan></text><text x="928" y="1218" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1218">A logging length limit unrelated to agent observations does not count.</tspan></text></svg>