<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 934" width="183mm" height="94.96mm" role="img" data-diagram-type="object-interaction" data-pattern-id="P09" aria-labelledby="title-P09 desc-P09"><title id="title-P09">P09: Deferred tool loading</title><desc id="desc-P09">Analytical object interaction; not an observed execution trace.</desc><defs><marker id="filledArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#17232D"/></marker><marker id="openArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,0.8 L10,4.5 L1,8.2" fill="none" stroke="#795548" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1800" height="934" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="48" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">P09  Deferred tool loading</text><text x="48" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#2F6F8F" text-anchor="start">Primitive / OBJECT INTERACTION / ANALYTICAL COLLABORATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="48" y="105">Discover capabilities only when needed.</tspan></text><text x="48" y="146" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">OBJECT INTERACTION</text><text x="1752" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">solid arrow: call/message · dashed open arrow: return/failure · analytical order, not an observed trace</text><g class="participant" data-participant="Agent" data-role="Agent" data-instance="agent"><rect x="78.4" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="78.4" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="218.4" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">agent</text><text x="218.4" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:Agent</text><line class="lifeline" x1="218.4" y1="230" x2="218.4" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="212.4" y="278" width="12" height="298" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="ToolDiscovery" data-role="ToolDiscovery" data-instance="toolDiscovery"><rect x="419.2" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="419.2" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="559.2" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">toolDiscovery</text><text x="559.2" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:ToolDiscovery</text><line class="lifeline" x1="559.2" y1="230" x2="559.2" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="553.2" y="278" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="ToolRegistry" data-role="ToolRegistry" data-instance="toolRegistry"><rect x="760" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="760" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="900" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">toolRegistry</text><text x="900" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:ToolRegistry</text><line class="lifeline" x1="900" y1="230" x2="900" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="894" y="332" width="12" height="190" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="AuthorizationPolicy" data-role="AuthorizationPolicy" data-instance="authorizationPolicy"><rect x="1100.8" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1100.8" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="1240.8" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">authorizationPolicy</text><text x="1240.8" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:AuthorizationPolicy</text><line class="lifeline" x1="1240.8" y1="230" x2="1240.8" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1234.8" y="386" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="Tool" data-role="Tool" data-instance="tool"><rect x="1441.6" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1441.6" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="1581.6" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">tool</text><text x="1581.6" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:Tool</text><line class="lifeline" x1="1581.6" y1="230" x2="1581.6" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1575.6" y="494" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="message forward" data-number="1" data-source="Agent" data-target="ToolDiscovery" data-message="search(capability)"><line x1="226.4" y1="292" x2="549.2" y2="292" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="284.1" y="264" width="209.4" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="388.8" y="280">1. search(capability)</tspan></text></g><g class="message forward" data-number="2" data-source="ToolDiscovery" data-target="ToolRegistry" data-message="resolve(tool)"><line x1="567.2" y1="346" x2="890" y2="346" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="648.4" y="318" width="162.4" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="729.6" y="334">2. resolve(tool)</tspan></text></g><g class="message forward" data-number="3" data-source="ToolRegistry" data-target="AuthorizationPolicy" data-message="authorize(tool)"><line x1="908" y1="400" x2="1230.8" y2="400" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="979.8" y="372" width="181.2" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1070.4" y="388">3. authorize(tool)</tspan></text></g><g class="message forward" data-number="4" data-source="AuthorizationPolicy" data-target="ToolRegistry" data-message="grant(handle)"><line x1="1232.8" y1="454" x2="910" y2="454" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="989.2" y="426" width="162.4" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1070.4" y="442">4. grant(handle)</tspan></text></g><g class="message forward" data-number="5" data-source="ToolRegistry" data-target="Tool" data-message="invoke(handle)"><line x1="908" y1="508" x2="1571.6" y2="508" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="1154.9" y="480" width="171.8" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1240.8" y="496">5. invoke(handle)</tspan></text></g><g class="message return-or-failure" data-number="6" data-source="Tool" data-target="Agent" data-message="return(result)"><line x1="1573.6" y1="562" x2="228.4" y2="562" stroke="#795548" stroke-width="1.5" marker-end="url(#openArrow)" stroke-dasharray="8 6"/><rect x="814.1" y="534" width="171.8" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#795548" text-anchor="middle" class="message-label"><tspan x="900" y="550">6. return(result)</tspan></text></g><rect x="48" y="652" width="842" height="216" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="66" y="680" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="66" y="710" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="710">Available tools are too numerous or expensive to expose eagerly.</tspan></text><text x="66" y="746" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="746">The agent searches, discovers, or lazily resolves a tool.</tspan></text><text x="66" y="782" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="782">Discovery descriptor, registry, authorization check, and invocation handle.</tspan></text><text x="66" y="818" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="818">Tool schema is loaded on demand and authority is checked before execution.</tspan></text><rect x="910" y="652" width="842" height="216" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="928" y="680" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="710" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="710">Tools have discoverable metadata and a stable invocation identity.</tspan></text><text x="928" y="746" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="746">A discovered tool can be invoked once with its own schema and current</tspan><tspan x="1026" y="768">permissions.</tspan></text><text x="928" y="804" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="804">Lazy loading does not cache a stale authorization decision.</tspan></text><text x="928" y="840" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="840">Unknown, stale, or unauthorized tools fail explicitly before side effects.</tspan></text><text x="48" y="899" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="400" fill="#536471" text-anchor="start">Sources: protocol/pattern_diagram_models.yaml (participants + messages); protocol/harness_pattern_specification.yaml (pointcut + contract).</text><text x="48" y="920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="start">Analytical collaboration only; no repository execution or message order is asserted.</text></svg>