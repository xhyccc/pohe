<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 912" width="183mm" height="92.72mm" role="img" data-diagram-type="object-interaction" data-pattern-id="P13" aria-labelledby="title-P13 desc-P13"><title id="title-P13">P13: Log-as-queue loops</title><desc id="desc-P13">Analytical object interaction; not an observed execution trace.</desc><defs><marker id="filledArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#17232D"/></marker><marker id="openArrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,0.8 L10,4.5 L1,8.2" fill="none" stroke="#795548" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1800" height="912" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="48" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">P13  Log-as-queue loops</text><text x="48" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#2F6F8F" text-anchor="start">Primitive / OBJECT INTERACTION / ANALYTICAL COLLABORATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="48" y="105">Drive work from a durable execution record.</tspan></text><text x="48" y="146" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">OBJECT INTERACTION</text><text x="1752" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">solid arrow: call/message · dashed open arrow: return/failure · analytical order, not an observed trace</text><g class="participant" data-participant="LogQueue" data-role="LogQueue" data-instance="logQueue"><rect x="78.4" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="78.4" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="218.4" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">logQueue</text><text x="218.4" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:LogQueue</text><line class="lifeline" x1="218.4" y1="230" x2="218.4" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="212.4" y="278" width="12" height="298" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="AppendStore" data-role="AppendStore" data-instance="appendStore"><rect x="419.2" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="419.2" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="559.2" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">appendStore</text><text x="559.2" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:AppendStore</text><line class="lifeline" x1="559.2" y1="230" x2="559.2" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="553.2" y="278" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="EventConsumer" data-role="EventConsumer" data-instance="eventConsumer"><rect x="760" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="760" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="900" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">eventConsumer</text><text x="900" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:EventConsumer</text><line class="lifeline" x1="900" y1="230" x2="900" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="894" y="332" width="12" height="190" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="ExternalEffect" data-role="ExternalEffect" data-instance="externalEffect"><rect x="1100.8" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1100.8" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="1240.8" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">externalEffect</text><text x="1240.8" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:ExternalEffect</text><line class="lifeline" x1="1240.8" y1="230" x2="1240.8" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1234.8" y="386" width="12" height="82" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="participant" data-participant="ReplayGuard" data-role="ReplayGuard" data-instance="replayGuard"><rect x="1441.6" y="166" width="280" height="64" rx="3" fill="#E8F0F6" stroke="#17232D" stroke-width="1.3" class="object-header"/><rect x="1441.6" y="166" width="5" height="64" rx="0" fill="#2F6F8F" stroke="none" stroke-width="1.2"/><text x="1581.6" y="191" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="600" fill="#17232D" text-anchor="middle" class="instance-name">replayGuard</text><text x="1581.6" y="214" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" font-weight="700" fill="#17232D" text-anchor="middle" class="role-name">:ReplayGuard</text><line class="lifeline" x1="1581.6" y1="230" x2="1581.6" y2="618" stroke="#9AAAB6" stroke-width="1.2" stroke-dasharray="7 6"/><rect x="1575.6" y="440" width="12" height="136" rx="0" fill="#C9DFEC" stroke="#17232D" stroke-width="1" class="activation"/></g><g class="message forward" data-number="1" data-source="LogQueue" data-target="AppendStore" data-message="append(event)"><line x1="226.4" y1="292" x2="549.2" y2="292" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="307.6" y="264" width="162.4" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="388.8" y="280">1. append(event)</tspan></text></g><g class="message forward" data-number="2" data-source="AppendStore" data-target="EventConsumer" data-message="consume(cursor)"><line x1="567.2" y1="346" x2="890" y2="346" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="639" y="318" width="181.2" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="729.6" y="334">2. consume(cursor)</tspan></text></g><g class="message forward" data-number="3" data-source="EventConsumer" data-target="ExternalEffect" data-message="apply(effect)"><line x1="908" y1="400" x2="1230.8" y2="400" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="989.2" y="372" width="162.4" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1070.4" y="388">3. apply(effect)</tspan></text></g><g class="message forward" data-number="4" data-source="ExternalEffect" data-target="ReplayGuard" data-message="record(effect)"><line x1="1248.8" y1="454" x2="1571.6" y2="454" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="1325.3" y="426" width="171.8" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1411.2" y="442">4. record(effect)</tspan></text></g><g class="message forward" data-number="5" data-source="ReplayGuard" data-target="EventConsumer" data-message="acknowledge(effect)"><line x1="1573.6" y1="508" x2="910" y2="508" stroke="#17232D" stroke-width="1.5" marker-end="url(#filledArrow)"/><rect x="1131.4" y="480" width="218.8" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#17232D" text-anchor="middle" class="message-label"><tspan x="1240.8" y="496">5. acknowledge(effect)</tspan></text></g><g class="message return-or-failure" data-number="6" data-source="ReplayGuard" data-target="LogQueue" data-message="replay(cursor)"><line x1="1573.6" y1="562" x2="228.4" y2="562" stroke="#795548" stroke-width="1.5" marker-end="url(#openArrow)" stroke-dasharray="8 6"/><rect x="814.1" y="534" width="171.8" height="27" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" class="message-label-background"/><text font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="600" fill="#795548" text-anchor="middle" class="message-label"><tspan x="900" y="550">6. replay(cursor)</tspan></text></g><rect x="48" y="652" width="842" height="194" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="66" y="680" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="66" y="710" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="710">New work is represented by durable append-only records.</tspan></text><text x="66" y="746" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="746">A consumer polls or subscribes to unseen records.</tspan></text><text x="66" y="782" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="782">Event identity, append order, consumer cursor, and acknowledgement.</tspan></text><text x="66" y="818" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="164" y="818">Work advances from the log without replaying already completed effects.</tspan></text><rect x="910" y="652" width="842" height="194" rx="3" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><text x="928" y="680" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="710" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="710">Records have stable identity and consumers retain progress.</tspan></text><text x="928" y="746" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="746">Each effectful unit has an idempotency or acknowledgement rule.</tspan></text><text x="928" y="782" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="782">Consumer crash does not erase unacknowledged work.</tspan></text><text x="928" y="818" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1026" y="818">Duplicate delivery is deduplicated or documented as at-least-once.</tspan></text><text x="48" y="877" font-family="Menlo, Monaco, Courier New, monospace" font-size="12" font-weight="400" fill="#536471" text-anchor="start">Sources: protocol/pattern_diagram_models.yaml (participants + messages); protocol/harness_pattern_specification.yaml (pointcut + contract).</text><text x="48" y="898" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="start">Analytical collaboration only; no repository execution or message order is asserted.</text></svg>