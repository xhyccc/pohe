<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1343" width="183mm" height="136.54mm" role="img" data-diagram-type="uml-class" data-pattern-id="R01" aria-labelledby="title-R01 desc-R01"><title id="title-R01">R01: Reason-act-observe</title><desc id="desc-R01">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#6D568D" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1343" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">R01  Reason-act-observe</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#6D568D" text-anchor="start">Reasoning / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Interleave reasoning and external actions.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="Agent" data-target="ReasoningStep" data-numbers="1,6" data-messages="reason(state) | observe(state)"><path d="M 851.35 325 Q 819.79 373 788.23 421" fill="none" stroke="#6D568D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ReasoningStep" data-target="ToolAction" data-numbers="2" data-messages="choose(action)"><path d="M 733 589 Q 733 637 733 685" fill="none" stroke="#6D568D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ToolAction" data-target="Observation" data-numbers="3" data-messages="act(action)"><path d="M 885 759 Q 900 759 915 759" fill="none" stroke="#6D568D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="Observation" data-target="LoopController" data-numbers="4" data-messages="observe(result)"><path d="M 1067 685 Q 1067 632 1067 579" fill="none" stroke="#6D568D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency return-or-failure" data-source="LoopController" data-target="Agent" data-numbers="5" data-messages="continue(observation)"><path d="M 1018.35 431 Q 983.5 378 948.65 325" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="class-node" data-participant="Agent" data-role="Agent" data-layer="0"><rect x="748" y="177" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="177" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="199" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Agent</text><line x1="748" y1="247" x2="1052" y2="247" stroke="#17232D" stroke-width="1.1"/><text x="766" y="271" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="297" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" fill="#536471" text-anchor="start" class="class-operation">(no incoming operation)</text></g><g class="class-node" data-participant="ReasoningStep" data-role="ReasoningStep" data-layer="1"><rect x="581" y="421" width="304" height="168" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="581" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="581" y="421" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="599" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="599" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ReasoningStep</text><line x1="581" y1="491" x2="885" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="599" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="599" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ reason(state)</text><text x="599" y="562" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ observe(state)</text></g><g class="class-node" data-participant="ToolAction" data-role="ToolAction" data-layer="2"><rect x="581" y="685" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="581" y="685" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="581" y="685" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="599" y="707" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="599" y="735" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ToolAction</text><line x1="581" y1="755" x2="885" y2="755" stroke="#17232D" stroke-width="1.1"/><text x="599" y="779" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="599" y="805" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ choose(action)</text></g><g class="class-node" data-participant="Observation" data-role="Observation" data-layer="2"><rect x="915" y="685" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="915" y="685" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="915" y="685" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="933" y="707" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="735" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Observation</text><line x1="915" y1="755" x2="1219" y2="755" stroke="#17232D" stroke-width="1.1"/><text x="933" y="779" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="933" y="805" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ act(action)</text></g><g class="class-node" data-participant="LoopController" data-role="LoopController" data-layer="1"><rect x="915" y="431" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="915" y="431" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="915" y="431" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="933" y="453" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="481" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">LoopController</text><line x1="915" y1="501" x2="1219" y2="501" stroke="#17232D" stroke-width="1.1"/><text x="933" y="525" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="933" y="551" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ observe(result)</text></g><g class="dependency-badge"><circle cx="819.79" cy="373" r="14" fill="#FFFFFF" stroke="#6D568D" stroke-width="1.4"/><text x="819.79" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#6D568D" text-anchor="middle">1,6</text></g><g class="dependency-badge"><circle cx="733" cy="637" r="14" fill="#FFFFFF" stroke="#6D568D" stroke-width="1.4"/><text x="733" y="641" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#6D568D" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="732" r="14" fill="#FFFFFF" stroke="#6D568D" stroke-width="1.4"/><text x="900" y="736" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#6D568D" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="1067" cy="632" r="14" fill="#FFFFFF" stroke="#6D568D" stroke-width="1.4"/><text x="1067" y="636" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#6D568D" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="983.5" cy="378" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="983.5" y="382" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">5</text></g><rect x="56" y="881" width="834" height="188" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="881" width="5" height="188" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="74" y="911" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="941" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="941">An agent can reason and use an external action interface.</tspan></text><text x="74" y="975" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="975">The model emits reasoning followed by an action request.</tspan></text><text x="74" y="1009" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1009">Parsed action, execution result, and observation fed into the next cycle.</tspan></text><text x="74" y="1043" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1043">External evidence enters the reasoning trajectory before the next action.</tspan></text><rect x="910" y="881" width="834" height="188" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="881" width="5" height="188" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="928" y="911" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="941" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="941">Action and observation schemas are stable enough to parse.</tspan></text><text x="928" y="975" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="975">Every executed action has an attributable observation or execution error.</tspan></text><text x="928" y="1009" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1009">Model reasoning is not treated as environment evidence.</tspan></text><text x="928" y="1043" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1043">Invalid action, unavailable tool, or parse error is exposed to the loop.</tspan></text><rect x="56" y="1089" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1089" width="5" height="210" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="74" y="1119" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1119" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1145">1 Agent → ReasoningStep reason(state)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1168">2 ReasoningStep → ToolAction choose(action)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1191">3 ToolAction → Observation act(action)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1214">4 Observation → LoopController observe(result)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1237">5 LoopController ↩ Agent continue(observation)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1260">6 Agent → ReasoningStep observe(state)</tspan></text><rect x="910" y="1089" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1089" width="5" height="210" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="928" y="1119" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1149" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1149">Prompt protocol, typed tool call, XML or text parser, and observation compression.</tspan></text><text x="928" y="1183" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1183">Test action-observation linkage, malformed action, tool error, and loop termination.</tspan></text><text x="928" y="1217" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1217">Chain-of-thought text without external action is not ReAct.</tspan></text></svg>