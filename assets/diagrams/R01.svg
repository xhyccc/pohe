<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1451" width="183mm" height="147.52mm" role="img" data-diagram-type="uml-class" data-pattern-id="R01" aria-labelledby="title-R01 desc-R01"><title id="title-R01">R01: Reason-act-observe</title><desc id="desc-R01">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#6D568D" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1451" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">R01  Reason-act-observe</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#6D568D" text-anchor="start">Reasoning / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Interleave reasoning and external actions.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="Agent" data-target="ReasoningStep" data-numbers="1,6" data-messages="reason(state) | observe(state)"><path d="M 847.62 325 Q 794.54 400 741.45 475" fill="none" stroke="#6D568D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ReasoningStep" data-target="ToolAction" data-numbers="2" data-messages="choose(action)"><path d="M 682 643 Q 682 718 682 793" fill="none" stroke="#6D568D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="ToolAction" data-target="Observation" data-numbers="3" data-messages="act(action)"><path d="M 834 867 Q 900 867 966 867" fill="none" stroke="#6D568D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="Observation" data-target="LoopController" data-numbers="4" data-messages="observe(result)"><path d="M 1118 793 Q 1118 713 1118 633" fill="none" stroke="#6D568D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency return-or-failure" data-source="LoopController" data-target="Agent" data-numbers="5" data-messages="continue(observation)"><path d="M 1065.62 485 Q 1009 405 952.38 325" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="class-node" data-participant="Agent" data-role="Agent" data-layer="0"><rect x="748" y="177" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="748" y="177" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="766" y="199" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="766" y="227" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Agent</text><line x1="748" y1="247" x2="1052" y2="247" stroke="#17232D" stroke-width="1.1"/><text x="766" y="271" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="766" y="297" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="400" fill="#536471" text-anchor="start" class="class-operation">(no incoming operation)</text></g><g class="class-node" data-participant="ReasoningStep" data-role="ReasoningStep" data-layer="1"><rect x="530" y="475" width="304" height="168" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="530" y="475" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="530" y="475" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="548" y="497" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="548" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ReasoningStep</text><line x1="530" y1="545" x2="834" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="548" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="548" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ reason(state)</text><text x="548" y="616" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ observe(state)</text></g><g class="class-node" data-participant="ToolAction" data-role="ToolAction" data-layer="2"><rect x="530" y="793" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="530" y="793" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="530" y="793" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="548" y="815" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="548" y="843" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ToolAction</text><line x1="530" y1="863" x2="834" y2="863" stroke="#17232D" stroke-width="1.1"/><text x="548" y="887" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="548" y="913" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ choose(action)</text></g><g class="class-node" data-participant="Observation" data-role="Observation" data-layer="2"><rect x="966" y="793" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="966" y="793" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="966" y="793" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="984" y="815" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="984" y="843" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Observation</text><line x1="966" y1="863" x2="1270" y2="863" stroke="#17232D" stroke-width="1.1"/><text x="984" y="887" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="984" y="913" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ act(action)</text></g><g class="class-node" data-participant="LoopController" data-role="LoopController" data-layer="1"><rect x="966" y="485" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="966" y="485" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="966" y="485" width="5" height="70" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="984" y="507" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="984" y="535" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">LoopController</text><line x1="966" y1="555" x2="1270" y2="555" stroke="#17232D" stroke-width="1.1"/><text x="984" y="579" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="984" y="605" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ observe(result)</text></g><g class="dependency-badge"><circle cx="794.54" cy="400" r="14" fill="#FFFFFF" stroke="#6D568D" stroke-width="1.4"/><text x="794.54" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#6D568D" text-anchor="middle">1,6</text></g><g class="dependency-badge"><circle cx="682" cy="718" r="14" fill="#FFFFFF" stroke="#6D568D" stroke-width="1.4"/><text x="682" y="722" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#6D568D" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="763" r="14" fill="#FFFFFF" stroke="#6D568D" stroke-width="1.4"/><text x="900" y="767" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#6D568D" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="1118" cy="713" r="14" fill="#FFFFFF" stroke="#6D568D" stroke-width="1.4"/><text x="1118" y="717" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#6D568D" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1009" cy="405" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="1009" y="409" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">5</text></g><rect x="56" y="989" width="834" height="188" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="989" width="5" height="188" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="74" y="1019" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="1049" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1049">An agent can reason and use an external action interface.</tspan></text><text x="74" y="1083" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1083">The model emits reasoning followed by an action request.</tspan></text><text x="74" y="1117" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1117">Parsed action, execution result, and observation fed into the next cycle.</tspan></text><text x="74" y="1151" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1151">External evidence enters the reasoning trajectory before the next action.</tspan></text><rect x="910" y="989" width="834" height="188" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="989" width="5" height="188" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="928" y="1019" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="1049" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1049">Action and observation schemas are stable enough to parse.</tspan></text><text x="928" y="1083" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1083">Every executed action has an attributable observation or execution error.</tspan></text><text x="928" y="1117" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1117">Model reasoning is not treated as environment evidence.</tspan></text><text x="928" y="1151" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1151">Invalid action, unavailable tool, or parse error is exposed to the loop.</tspan></text><rect x="56" y="1197" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1197" width="5" height="210" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="74" y="1227" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1227" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1253">1 Agent → ReasoningStep reason(state)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1276">2 ReasoningStep → ToolAction choose(action)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1299">3 ToolAction → Observation act(action)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1322">4 Observation → LoopController observe(result)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1345">5 LoopController ↩ Agent continue(observation)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1368">6 Agent → ReasoningStep observe(state)</tspan></text><rect x="910" y="1197" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1197" width="5" height="210" rx="0" fill="#6D568D" stroke="none" stroke-width="1.2"/><text x="928" y="1227" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1257" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1257">Prompt protocol, typed tool call, XML or text parser, and observation compression.</tspan></text><text x="928" y="1291" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1291">Test action-observation linkage, malformed action, tool error, and loop termination.</tspan></text><text x="928" y="1325" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1325">Chain-of-thought text without external action is not ReAct.</tspan></text></svg>