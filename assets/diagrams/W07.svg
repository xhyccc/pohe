ill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="599" y="551" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ request(handoff)</text></g><g class="class-node" data-participant="AuthorityPolicy" data-role="AuthorityPolicy" data-layer="2"><rect x="581" y="685" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="581" y="685" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="581" y="685" width="5" height="70" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="599" y="707" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="599" y="735" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">AuthorityPolicy</text><line x1="581" y1="755" x2="885" y2="755" stroke="#17232D" stroke-width="1.1"/><text x="599" y="779" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="599" y="805" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ check(authority)</text></g><g class="class-node" data-participant="TargetAgent" data-role="TargetAgent" data-layer="1"><rect x="915" y="421" width="304" height="168" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="915" y="421" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="915" y="421" width="5" height="70" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="933" y="443" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="471" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">TargetAgent</text><line x1="915" y1="491" x2="1219" y2="491" stroke="#17232D" stroke-width="1.1"/><text x="933" y="515" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="933" y="541" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ transfer(control)</text><text x="933" y="562" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ restore(context)</text></g><g class="class-node" data-participant="SharedState" data-role="SharedState" data-layer="2"><rect x="915" y="685" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="915" y="685" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="915" y="685" width="5" height="70" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2" class="class-accent"/><text x="933" y="707" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="933" y="735" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">SharedState</text><line x1="915" y1="755" x2="1219" y2="755" stroke="#17232D" stroke-width="1.1"/><text x="933" y="779" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="933" y="805" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ preserve(context)</text></g><g class="dependency-badge"><circle cx="816.5" cy="378" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="816.5" y="382" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="733" cy="632" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="733" y="636" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="893.43" cy="637" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="893.43" y="641" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="932.06" cy="656.38" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="932.06" y="660.38" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1067" cy="637" r="14" fill="#FFFFFF" stroke="#9A681D" stroke-width="1.4"/><text x="1067" y="641" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A681D" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="980.21" cy="373" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="980.21" y="377" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="881" width="834" height="230" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="881" width="5" height="230" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2"/><text x="74" y="911" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="941" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="941">Multiple peer agents can transfer control.</tspan></text><text x="74" y="975" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="975">The active agent invokes a handoff target.</tspan></text><text x="74" y="1009" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1009">Control-transfer envelope, state policy, target criteria, and authority</tspan><tspan x="210" y="1030">boundary.</tspan></text><text x="74" y="1064" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1064">The target becomes active with declared history and no implicit privilege</tspan><tspan x="210" y="1085">expansion.</tspan></text><rect x="910" y="881" width="834" height="230" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="881" width="5" height="230" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2"/><text x="928" y="911" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="941" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="941">Target identity and transfer trigger are explicit.</tspan></text><text x="928" y="975" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="975">Handoff records source, target, and transferred state.</tspan></text><text x="928" y="1009" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1009">Control cannot cycle indefinitely or return to an invalid target.</tspan></text><text x="928" y="1043" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1043">Unknown targets, disabled handoffs, and loops have defined outcomes.</tspan></text><rect x="56" y="1131" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1131" width="5" height="210" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2"/><text x="74" y="1161" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1161" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1187">1 ActiveAgent → HandoffController request(handoff)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1210">2 HandoffController → AuthorityPolicy check(authority)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1233">3 AuthorityPolicy → TargetAgent transfer(control)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1256">4 HandoffController → SharedState preserve(context)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1279">5 SharedState → TargetAgent restore(context)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1302">6 TargetAgent ↩ ActiveAgent return(failure)</tspan></text><rect x="910" y="1131" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1131" width="5" height="210" rx="0" fill="#9A681D" stroke="none" stroke-width="1.2"/><text x="928" y="1161" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1191" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1191">History filters, target criteria, enable predicates, and cycle controls.</tspan></text><text x="928" y="1225" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1225">Test transfer, filtered history, disabled target, cycle, and authority.</tspan></text><text x="928" y="1259" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1259">A normal function call that returns to the caller is not a handoff.</tspan></text></svg>