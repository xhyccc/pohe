<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1385" width="183mm" height="140.81mm" role="img" data-diagram-type="uml-class" data-pattern-id="W07" aria-labelledby="title-W07 desc-W07"><title id="title-W07">W07: Decentralized handoffs</title><desc id="desc-W07">Analytical UML class view of the proposed pattern contract; not an observed implementation or execution trace.</desc><defs><marker id="umlOpenAccent" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#9A681D" stroke-width="1.4"/></marker><marker id="umlOpenReturn" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#795548" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1800" height="1385" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="56" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#17232D" text-anchor="start">W07  Decentralized handoffs</text><text x="56" y="77" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="700" fill="#9A681D" text-anchor="start">Workflow / UML CLASS VIEW / ANALYTICAL MODEL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#536471" text-anchor="start"><tspan x="56" y="105">Transfer control to another specialized agent.</tspan></text><text x="56" y="139" font-family="Menlo, Monaco, Courier New, monospace" font-size="15" font-weight="700" fill="#17232D" text-anchor="start">UML CLASS VIEW</text><text x="1744" y="139" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#536471" text-anchor="end">dashed arrow: call dependency · brown: return/failure · analytical, not an observed trace</text><g class="dependency forward" data-source="ActiveAgent" data-target="HandoffController" data-numbers="1" data-messages="request(handoff)"><path d="M 851.35 325 Q 816.5 378 781.65 431" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="HandoffController" data-target="AuthorityPolicy" data-numbers="2" data-messages="check(authority)"><path d="M 733 579 Q 733 632 733 685" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="AuthorityPolicy" data-target="TargetAgent" data-numbers="3" data-messages="transfer(control)"><path d="M 830.31 685 Q 893.43 637 956.54 589" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="HandoffController" data-target="SharedState" data-numbers="4" data-messages="preserve(context)"><path d="M 830.31 579 Q 900 632 969.69 685" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency forward" data-source="SharedState" data-target="TargetAgent" data-numbers="5" data-messages="restore(context)"><path d="M 1067 685 Q 1067 637 1067 589" fill="none" stroke="#9A681D" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenAccent)"/></g><g class="dependency return-or-failure" data-source="TargetAgent" data-target="ActiveAgent" data-numbers="6" data-messages="return(failure)"><path d="M 1011.77 421 Q 980.21 373 948.65 325" fill="none" stroke="#795548" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#umlOpenReturn)"/></g><g class="class-node" data-participant="ActiveAgent" data-role="ActiveAgent" data-layer="0"><rect x="748" y="177" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="748" y="177" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect 