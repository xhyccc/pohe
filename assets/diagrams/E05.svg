" y="773" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="984" y="795" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="984" y="823" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">Evaluator</text><line x1="966" y1="843" x2="1270" y2="843" stroke="#17232D" stroke-width="1.1"/><text x="984" y="867" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="984" y="893" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ submit(candidate)</text></g><g class="class-node" data-participant="ExecutableHarness" data-role="ExecutableHarness" data-layer="1"><rect x="966" y="475" width="304" height="148" rx="2" fill="#FFFFFF" stroke="#17232D" stroke-width="1.3" class="class-box"/><rect x="966" y="475" width="304" height="70" rx="2" fill="#E8F0F6" stroke="none" stroke-width="1.2" class="class-header"/><rect x="966" y="475" width="5" height="70" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2" class="class-accent"/><text x="984" y="497" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#536471" text-anchor="start" class="class-stereotype">«role»</text><text x="984" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#17232D" text-anchor="start" class="class-name">ExecutableHarness</text><line x1="966" y1="545" x2="1270" y2="545" stroke="#17232D" stroke-width="1.1"/><text x="984" y="569" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="700" fill="#536471" text-anchor="start" class="class-compartment-label">OPERATIONS / RECEIVED CALLS</text><text x="984" y="595" font-family="Menlo, Monaco, Courier New, monospace" font-size="14" font-weight="600" fill="#17232D" text-anchor="start" class="class-operation">+ accept(artifact)</text></g><g class="dependency-badge"><circle cx="791" cy="400" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="791" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">1</text></g><g class="dependency-badge"><circle cx="682" cy="698" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="682" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">2</text></g><g class="dependency-badge"><circle cx="900" cy="743" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="900" y="747" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">3</text></g><g class="dependency-badge"><circle cx="1118" cy="698" r="14" fill="#FFFFFF" stroke="#9A5134" stroke-width="1.4"/><text x="1118" y="702" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#9A5134" text-anchor="middle">4</text></g><g class="dependency-badge"><circle cx="1009" cy="400" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="1009" y="404" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">5</text></g><g class="dependency-badge"><circle cx="900" cy="829" r="14" fill="#FFFFFF" stroke="#795548" stroke-width="1.4"/><text x="900" y="833" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#795548" text-anchor="middle">6</text></g><rect x="56" y="969" width="834" height="188" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="969" width="5" height="188" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="74" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">POINTCUT / PATTERN INTERFACE</text><text x="74" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">CONTEXT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1029">Harness behavior is assembled from independently typed components.</tspan></text><text x="74" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TRIGGER</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1063">Components are selected, composed, or replaced.</tspan></text><text x="74" y="1097" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">STRUCTURE</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1097">Component interface, composition builder, evaluator, and artifact registry.</tspan></text><text x="74" y="1131" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">EFFECT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="210" y="1131">The built harness is executable and its component provenance is recoverable.</tspan></text><rect x="910" y="969" width="834" height="188" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="969" width="5" height="188" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="928" y="999" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">CONTRACT / REQUIRED BEHAVIOR</text><text x="928" y="1029" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">REQUIRES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1029">Components have compatible contracts and composition operators.</tspan></text><text x="928" y="1063" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">ENSURES</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1063">Invalid composition is rejected before execution.</tspan></text><text x="928" y="1097" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">INVARIANT</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1097">Reusing a component does not silently reuse privileged state.</tspan></text><text x="928" y="1131" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VIOLATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1131">Build conflicts, incompatible versions, and evaluation failure are explicit.</tspan></text><rect x="56" y="1177" width="834" height="210" rx="2" fill="#FFFFFF" stroke="#B8C4CD" stroke-width="1.2"/><rect x="56" y="1177" width="5" height="210" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="74" y="1207" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">RELATIONSHIPS / ANALYTICAL CALLS</text><text x="872" y="1207" font-family="Menlo, Monaco, Courier New, monospace" font-size="10" font-weight="400" fill="#536471" text-anchor="end">number · caller → callee · message</text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1233">1 ComponentLibrary → HarnessFoundry provide(components)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1256">2 HarnessFoundry → HarnessAssembler assemble(components)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1279">3 HarnessAssembler → Evaluator submit(candidate)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="74" y="1302">4 Evaluator → ExecutableHarness accept(artifact)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1325">5 ExecutableHarness ↩ ComponentLibrary report(reusable)</tspan></text><text font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="400" fill="#795548" text-anchor="start"><tspan x="74" y="1348">6 Evaluator ↩ HarnessAssembler feedback(failure)</tspan></text><rect x="910" y="1177" width="834" height="210" rx="2" fill="#F7F9FB" stroke="#B8C4CD" stroke-width="1.2"/><rect x="910" y="1177" width="5" height="210" rx="0" fill="#9A5134" stroke="none" stroke-width="1.2"/><text x="928" y="1207" font-family="Menlo, Monaco, Courier New, monospace" font-size="13" font-weight="700" fill="#536471" text-anchor="start">VARIATION / TEST / NEGATIVE CONTROL</text><text x="928" y="1237" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">VARIATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1237">Typed processors, foundry DSL, component search, and immutable builders.</tspan></text><text x="928" y="1271" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">TEST_OBLIGATION</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1271">Test composition, incompatible component, rebuild, and provenance.</tspan></text><text x="928" y="1305" font-family="Menlo, Monaco, Courier New, monospace" font-size="11" font-weight="700" fill="#536471" text-anchor="start">NEGATIVE_CONTROL</text><text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#17232D" text-anchor="start"><tspan x="1064" y="1305">Separate helper functions without component contracts are insufficient.</tspan></text></svg>